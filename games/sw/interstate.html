<title>Redline Interstate</title>
  <meta name="arcade-home" content="../../index.html">

       intro record all hang off it, and all of them are erased together -->

<style>
/* Self-hosted — no network call at launch, so a wrapped native build
   and the offline PWA both render correctly. Generated by fonts.py.
   Variable families ship whole with a weight RANGE: instancing each
   weight separately produced files the browser silently refused. */
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:600;font-display:swap;src:url("../../fonts/sairacondensed-600.woff2") format("woff2")}
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:800;font-display:swap;src:url("../../fonts/sairacondensed-800.woff2") format("woff2")}
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-display:swap;src:url("../../fonts/archivo-var.woff2") format("woff2")}

:root{
  --sodium:#ff8a3d;
  --pale:#ffeede;
  --dim:rgba(255,238,222,.5);
  --red:#ff3355;
  --blue:#4d8cff;
  /* named at last: `#rotate b` has been asking for `--gold` with a literal
     fallback since it was written, and the wanted stars need the same one */
  --gold:#e8b23a;
  --cyan:#5ff0d8;
  --disp:"Saira Condensed","Arial Narrow",sans-serif;
  --lab:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;width:100%;position:fixed;overflow:hidden;background:#08050f;
  color:var(--pale);font-family:var(--lab);
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
}
#stage{position:absolute;inset:0;display:grid;place-items:center}
#frame{
  position:relative;overflow:hidden;background:#08050f;
  width:min(100dvw, calc(var(--stage-h, 100dvh) * 0.70));height:var(--stage-h, 100dvh);
}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ------------ HUD ------------ */
/* ---- THE READOUTS ARE ANCHORED IN THE SAME SPACE AS THE CONTROLS (RLG-082)
   Owner, 2026-08-30: "fix the anchored relative spacing of UI elements", on the
   driving HUD.

   The shell publishes `--ark-ui`, which is 1 on a phone and rises to 1.8 on a
   big screen, and its note says games opt in by scaling their own overlay -
   "the shell cannot do it for them without knowing what is a control and what
   is the game itself". This cabinet opted its CONTROLS in and left its
   READOUTS behind. So at 1.8 the wheel, the pedals, the bottle and the dials
   are half as big again while TIME and DISTANCE are the same 26px they are on
   a phone, stranded in corners that have moved 200 pixels further out.

   Nothing here is a new size. Every number is the size it already was,
   multiplied by the same scale everything beside it already uses - so a phone
   is unchanged to the pixel and a bigger screen gets a HUD in proportion with
   the hands using it.
   ---------------------------------------------------------------------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;
  /* the TOP padding is the safe area only: the row below the mirror owns the whole
     distance from the top of the stage, so it can be measured against the glass
     rather than against whatever this padding happens to be (RLG-082) */
  padding:var(--safe-top, env(safe-area-inset-top,0px))
          calc(14px * var(--ark-ui,1))
          calc(env(safe-area-inset-bottom,0px) + 14px * var(--ark-ui,1));
  display:flex;flex-direction:column;justify-content:space-between}
/* ---- CLEAR OF THE GLASS, MEASURED AGAINST THE GLASS (RLG-082) ---------
   This was a hardcoded 58, which was 6 of margin plus a 44-pixel mirror plus 8
   of gap - three numbers collapsed into one, in a different file from the two
   that decide them. The engine publishes the mirror's height as `--mirror-h`
   and its margin as `--mirror-top` now, so the row below it moves when the
   glass does and nobody has to remember. The fallbacks are the old values, so
   a cabinet whose engine has not published yet still lays out correctly.
   -------------------------------------------------------------------- */
/* ---- WHAT SITS UNDER THE GLASS (RLG-082) -----------------------------
   Owner, 2026-08-30: the countdown belongs centred below the mirror; the
   pursuit's information belongs there too, as a set of stars for the wanted
   level; and with both on they are one group, centred, clock left and stars
   right with a gap between.

   So the row is CENTRED rather than spread, and it holds only the panels that
   are live. One of them centres itself; two of them centre as a pair, which is
   what a flex row does for nothing. DISTANCE has left the row entirely - it is
   on the odometer, where a car keeps it.
   -------------------------------------------------------------------- */
.toprow{ padding-top:calc(var(--mirror-top,6px) + var(--mirror-h,44px) + 8px * var(--ark-ui,1));
  display:flex;justify-content:center;align-items:flex-start;
  gap:calc(22px * var(--ark-ui,1))}
/* ---- the wanted level: five stars, always, filling by heat points ---------
   Owner, 2026-09-07: "they should just be horizontal the whole time, and we
   should show five stars but as outlines that fill in... it would be even cooler
   if we have a gradient fill from left to right of each star to represent the
   heat points each star represents".

   A ROW, EXPLICITLY. It read vertical at one star and horizontal after because
   the stars were characters in a block that was free to wrap; a flex row of five
   boxes cannot do that at any count.

   The unearned stars stay VISIBLE, which was already ruled: the level reads as
   "three of five" rather than "three". The one being filled clips an orange
   gradient to the glyph, so the fill runs left to right across the star itself
   and moves with every point rather than snapping. */
/* ---- THE STARS ARE HOT OR COLD (owner, 2026-09-08) ----------------------
   Gold while a cruiser is actually engaged to you, blue while you are cooling.
   OUTLINE AND FILL TOGETHER, which is what the owner asked for: one colour
   says the state and the fill level says the amount, so the row answers "how
   wanted" and "right now?" in one glance. It replaced a separate PURSUIT row
   that said the second half in words.

   THE OUTLINE IS A REAL STROKE. These were solid glyphs before - an unfilled
   star was the same shape in a paler colour, so there was no outline to give a
   colour to. `-webkit-text-stroke` draws the edge and the fill is painted
   through `background-clip:text`, which is how the partial star already worked.
   Both are supported wherever this ships: it is a WebKit/Blink phone.
   ---------------------------------------------------------------------- */
#wanted{ display:flex;flex-direction:row;justify-content:center;
  gap:calc(3px * var(--ark-ui,1));white-space:nowrap;line-height:1;
  --star:var(--blue);--starGlow:rgba(77,140,255,.55) }
#wanted.hot{ --star:var(--gold);--starGlow:rgba(232,178,58,.60) }
#wanted b{ font-size:calc(19px * var(--ark-ui,1));font-weight:400;line-height:1;
  color:transparent;text-shadow:none;
  -webkit-text-stroke:calc(1px * var(--ark-ui,1)) var(--star);
  paint-order:stroke fill }
/* an earned star is filled solid in the state's colour, and glows */
#wanted b.on{ background:var(--star);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 5px var(--starGlow)) }
/* the one the total is part-way through fills from the left */
#wanted b.part{
  background:linear-gradient(90deg,var(--star) 0,var(--star) var(--fill,0%),
             transparent var(--fill,0%),transparent 100%);
  -webkit-background-clip:text;background-clip:text }
/* and an unearned star is the outline alone, dimmed so the row reads as a
   gauge rather than five equal marks */
#wanted b.off{ opacity:.42 }
/* ---- the radar detector: four bars that fill toward the contact (RLG-164) -
   Owner, 2026-09-07: a detector "for upcoming speed traps and traffic cops,
   just like it was done in the original Need for Speed games".

   IT SHARES THE STAT PANEL'S SHAPE so it reads as part of the same row rather
   than as a thing bolted on, and it is only in the DOM row while there is
   something to warn about - the engine hides the wrapper. The bars are `i`
   elements, which the stat panel already styles as a small unit; these are
   given a size of their own because they are marks rather than text. */
#radar{ display:flex;flex-direction:row;justify-content:center;
  gap:calc(3px * var(--ark-ui,1));line-height:1;
  height:calc(19px * var(--ark-ui,1));align-items:flex-end }
#radar i{ display:block;width:calc(5px * var(--ark-ui,1));
  height:calc(9px * var(--ark-ui,1));margin:0;
  background:rgba(255,238,222,.22);border-radius:1px }
/* each bar is taller than the last, so the row reads as a ramp even before any
   of it lights - a flat row of four says nothing about which end is worse */
#radar i:nth-child(2){ height:calc(13px * var(--ark-ui,1)) }
#radar i:nth-child(3){ height:calc(16px * var(--ark-ui,1)) }
#radar i:nth-child(4){ height:calc(19px * var(--ark-ui,1)) }
#radar i.on{ background:#ffb347;box-shadow:0 0 10px rgba(255,179,71,.55) }
#radar i.hot{ background:#ff5a3d;box-shadow:0 0 12px rgba(255,90,61,.65) }
.stat span{display:block;font-size:calc(8.5px * var(--ark-ui,1));font-weight:700;letter-spacing:.22em;color:var(--dim)}
.stat b{font-family:var(--disp);font-weight:800;font-size:calc(26px * var(--ark-ui,1));line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat i{font-style:normal;font-size:calc(11px * var(--ark-ui,1));font-weight:600;color:var(--dim);margin-left:2px}
.stat.r{text-align:right}
.stat.c{text-align:center;flex:0 0 auto}
/* the clock is the loudest thing in the HUD, because it is the thing that
   ends the run */
#clockWrap b{font-size:calc(30px * var(--ark-ui,1));color:#ffb347;letter-spacing:.02em;
  text-shadow:0 0 18px rgba(255,179,71,.55)}
#clockWrap.low b{color:#ff5a4a;text-shadow:0 0 22px rgba(255,90,74,.75)}
/* ---- A GAUGE LIGHTS WHEN SOMETHING GOES INTO IT (RLG-126) -----------------
   A line in the middle of the screen is read once and gone; the clock and the
   bottle are what the player watches for the rest of the run. Lighting the
   thing the award went INTO teaches where to look rather than what to read,
   and it is the same mechanism the clock already uses to say it is running out
   - a class, and the colour it carries. `.gain` beats `.low` because a
   transform and a colour are different properties, so a top-up on the last
   five seconds reads as both at once, which is exactly what it is. */
#clockWrap.gain b{
  color:#7dffb0;text-shadow:0 0 24px rgba(125,255,176,.85);
  transform:scale(1.12);
}
#clockWrap b{ transition:color .18s linear, text-shadow .18s linear, transform .18s ease-out;
              display:inline-block }
#nitro.gain i{
  filter:brightness(1.5) saturate(1.15);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.6), inset 0 -6px 10px rgba(0,0,0,.35),
             0 0 14px rgba(125,255,235,.75), 0 4px 12px -3px #000;
}
#nitro i{ transition:filter .18s linear, box-shadow .18s linear }


/* pointer-events:none — this banner is full-width and sits ON TOP of the
   canvas, so while a warning was on screen (PIT LANE, WRONG WAY, BUSTED) it
   silently swallowed every tap that landed in its band. Nothing on it is
   interactive; it should never have been a target. */
/* ---- IT SITS UNDER THE INFORMATION ROW, NOT OVER THE ROAD (RLG-134) ----
   Owner, 2026-08-31: "the UI elements that pop up in the dead center of the
   screen block my view of the upcoming road, so I think we should move that to
   just under the other information that's below the rearview mirror."

   `top:38%` IS THE FAULT AND A PERCENTAGE IS WHY IT RECURS. A fraction of the
   screen lands wherever the screen happens to put it, so the banner sits on the
   road on one phone and clear of it on another. `--msg-top` is measured from
   `.toprow`'s own bottom and published by the engine each frame, which is the
   whole of what "anchored relative spacing" means: a distance follows the thing
   it is a distance FROM. The 38% survives only as the fallback for a frame
   before the first measurement.

   SMALLER, BECAUSE IT IS NO LONGER ALONE IN THE MIDDLE OF THE FRAME. It was
   sized to be read across an empty windscreen; under the mirror it shares the
   busiest band on the screen with the glass and the information row. */
#warn{
  position:absolute;left:0;right:0;top:var(--msg-top,38%);text-align:center;pointer-events:none;
  font-family:var(--disp);font-weight:800;font-size:clamp(15px,4.6vw,22px);letter-spacing:.10em;
  color:#fff;text-shadow:0 0 18px var(--red),0 2px 0 #7a0d20;opacity:0;
}
#warn.on{animation:wn 1.9s ease-out 1}
@keyframes wn{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:scale(1)}
              70%{opacity:1}100%{opacity:0}}

.botrow{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(12px * var(--ark-ui,1))}
.speedo{display:flex;align-items:baseline;gap:calc(5px * var(--ark-ui,1))}
/* the speed reading is already viewport-relative through `vw`, which is the
   same idea by another route - it is left alone rather than scaled twice */
.speedo b{font-family:var(--disp);font-weight:800;font-size:clamp(46px,15vw,68px);
  line-height:.8;font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(255,138,61,.45)}
.speedo span{font-size:calc(9px * var(--ark-ui,1));font-weight:700;letter-spacing:.2em;color:var(--dim);padding-bottom:4px}
.bars{flex:1;max-width:calc(140px * var(--ark-ui,1));display:flex;flex-direction:column;
  gap:calc(5px * var(--ark-ui,1));margin-bottom:calc(6px * var(--ark-ui,1))}
.bar{display:flex;align-items:center;gap:calc(6px * var(--ark-ui,1))}
.bar em{font-style:normal;font-size:calc(8px * var(--ark-ui,1));font-weight:700;letter-spacing:.16em;color:var(--dim);width:calc(26px * var(--ark-ui,1))}
.trk{flex:1;height:calc(7px * var(--ark-ui,1));background:rgba(255,238,222,.10);position:relative;overflow:hidden;
  transform:skewX(-18deg)}
.trk i{position:absolute;inset:0;width:0;display:block;transition:width .12s linear}
#dmgFill{background:linear-gradient(90deg,#7a2233,var(--red))}
#nosFill{background:linear-gradient(90deg,#1d6e73,var(--cyan))}

/* Both controls under one thumb on a steep diagonal: BRAKE low and outboard
   where the thumb rests, NOS above and inboard so it takes a deliberate reach.
   `body.pedals-left` mirrors the pair. */
/* ---- the pedal box ------------------------------------------------------
   Brake and accelerator side by side as actual pedals, hinged at the top and
   tilting when pressed. The nitrous is a bottle lying on its side ABOVE the
   accelerator, because pressing it means gas AND nitrous at once.
   -------------------------------------------------------------------------- */
/* The whole cluster was 150x186 with 62x122 pedals — it covered the player's
   own car and ran off the bottom of the screen. Everything is about 70% of
   what it was, tucked into the corner, and nothing overlaps anything else. */
#pedals{
  position:absolute;z-index:12;pointer-events:none;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 10px);
  /* ---- THE BOX'S OWN OFFSET IS IN THE SCALED SPACE TOO (RLG-082) ----
     Everything INSIDE this box is scaled by --ark-ui and this offset was not,
     so the gap below the bottle grew with the scale while the gap above it did
     not: 7.4 and 10.2 where both were meant to be 7.4. Two distances in the
     same stack have to be in the same units, which is the same rule that put
     the dials' offsets into this space in the first place.
     ------------------------------------------------------------- */
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px * var(--ark-ui,1));
  width:104px;height:126px;
}
#pedals button{
  position:absolute;pointer-events:auto;padding:0;border:0;background:none;
  -webkit-tap-highlight-color:transparent;
}
/* the two pedals: rubber pads on a steel arm, tilting on press */
#gas, #brake{
  bottom:0;width:46px;height:84px;
  perspective:170px;
}
#brake{ left:0 }
#gas{ right:0 }
#gas i, #brake i{
  display:block;width:100%;height:100%;border-radius:7px 7px 5px 5px;
  transform-origin:50% 0%;
  transition:transform .07s ease-out, filter .07s ease-out;
  background:
    repeating-linear-gradient(to bottom,
      rgba(255,255,255,.10) 0 3px, rgba(0,0,0,.22) 3px 7px),
    linear-gradient(to bottom, #3a3f47 0%, #23262c 55%, #15171b 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.22),
    inset 0 -6px 10px rgba(0,0,0,.6),
    0 5px 0 #0c0d10, 0 10px 16px -6px #000;
  border:1px solid #4a505a;
}
#brake i{ border-color:#6b3436; box-shadow:inset 0 2px 0 rgba(255,150,150,.22),
  inset 0 -6px 10px rgba(0,0,0,.6), 0 5px 0 #2a0e10, 0 10px 16px -6px #000 }
#gas i{ border-color:#3f5f42; box-shadow:inset 0 2px 0 rgba(170,255,180,.20),
  inset 0 -6px 10px rgba(0,0,0,.6), 0 5px 0 #0e2412, 0 10px 16px -6px #000 }
/* pressed: the pad rotates away and drops onto its stop */
#gas.on i, #brake.on i{ transform:rotateX(26deg) translateY(4px); filter:brightness(1.5) }
#brake.on i{ filter:brightness(1.35) saturate(1.5) }

/* the nitrous bottle, lying on its side over the accelerator */
/* a car with no bottle shows no bottle — the LORRY and the CAB had a nitrous
   button and a gauge they could never use */
body.nonos #nitro, body.nonos #nosWrap{ display:none !important }
/* ---- AND THE STACK CLOSES UP OVER IT (RLG-028) --------------------------
   Owner: cars without NOS did not have the gauges collapse down to the pedals.
   Hiding the bottle left the space it stood in, so a car without one drove with
   a hole in its instruments - the shifter and the dials went on measuring their
   height from where a bottle would have been.

   The cluster stacks bottom-up: pedals, bottle, shifter, dials. `--bottle` is
   how much room the bottle takes in that stack, and it is the only thing that
   changes - every offset above it is written as a distance from the pedals PLUS
   that space, so setting it to zero closes the gap and nothing else has to know
   why. One number, and the layout follows the car.
   ---------------------------------------------------------------------- */
body{ --bottle:36px }   /* the bottle's 30, plus one 6px gap */
body.nonos{ --bottle:0px }
#nitro{
  /* The dials and the gate were landing on top of it. 92px cleared the pedals
     but nothing above, so it needed the gap raising — not by much, or it
     drifts away from the thumb that presses it. */
  /* ---- CENTRED OVER THE PAIR, AND EVENLY SPACED (RLG-082) ---------
     Owner, 2026-08-30: the bottle should be centred above the brake and the
     accelerator, and have equal padding between them and the gauges.

     It was neither. `right:0` put it 16px right of the pads' own centre - the
     pads are 46 wide at each end of a 104-wide box, so their centre is 52 and
     the bottle's was 68. And it sat ON the pads with a 0 gap below it and 6
     above. One gap, used on both sides: 6 below, 6 above, and the dials move
     up by the same 6 so the stack keeps its rhythm.
     ------------------------------------------------------------- */
  /* ---- AND THE GAP IS MEASURED TO THE INK (RLG-082) ----------------
     The owner saw that the gap above the bottle was still bigger than the one
     below it, on a build whose numbers said they were equal - and named the
     cause: the gauges have their own padding. They do. The two faces are drawn
     into a canvas that reaches 2.5 pixels lower than anything painted in it, so
     a distance measured to the BOX is smaller than the distance anybody can
     see. Both gaps are 8 to the INK now, which is what the eye is judging.
     ------------------------------------------------------------- */
  /* ---- AND CENTRED BY ITS INK, NOZZLE INCLUDED (RLG-082) ----------
     Owner, 2026-08-30: it still was not laterally centred, and named the cause -
     the measurement did not include the NOZZLE. The valve and the tapered outlet
     hang off the LEFT of the button, outside the box that was being centred, so a
     button centred on 52 drew a picture centred on 42 and the eye judges the
     picture. This is the sideways form of the lesson the gauges taught: centre the
     ink, not the container it is drawn in.

     `--nozzle` is how far the ink reaches past the button's own left edge. It is
     written once, the outlet is placed from it, and this offset is derived from it,
     so the two can never disagree. The picture is 72px + --nozzle wide, and it is
     the PICTURE that is centred over the pair of pads.
     ------------------------------------------------------------- */
  --nozzle:20px;   /* the outlet's tip reaches this far past the bottle */
  --tip:9px;       /* and the tapered outlet itself is this wide */
  left:calc((104px - 72px - var(--nozzle)) / 2 + var(--nozzle));
  right:auto;bottom:92px;width:72px;height:30px;
}

#nitro i{
  display:block;width:100%;height:100%;position:relative;overflow:hidden;
  /* The DOMED BASE is on the right and the tapered shoulder on the left,
     because that is the end the valve screws into — the nozzle was on the
     base, which is the one place a bottle has no opening at all. */
  border-radius:7px 16px 16px 7px;
  /* The bottle IS the gauge now — the old #nosFill bar sat under the pedals
     where nothing could see it. --nos is set every frame; the charge fills
     from the neck end and the empty part reads as dark glass. */
  background:
    /* drains from the valve end, so the charge you have left sits against the
       base — which is the way round a real bottle empties */
    linear-gradient(to right,
      rgba(8,30,32,.92) 0%,
      rgba(8,30,32,.92) calc(100% - var(--nos,40%)),
      transparent      calc(100% - var(--nos,40%))),
    linear-gradient(to bottom,#7ef0dc 0%,#2fbcae 42%,#0e5f60 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45), inset 0 -6px 10px rgba(0,0,0,.45),
             0 4px 12px -3px #000;
  border:1px solid rgba(140,255,238,.5);
}
/* The neck, valve and NOZZLE. It was a plain block on the end — a bottle needs
   somewhere for the gas to actually leave, so this is a brass valve body with a
   tapered nozzle tip beyond it. */
/* The brass valve body, on the NECK end. It lives on the BUTTON, not on the
   bottle: `#nitro i` carries `overflow:hidden` for the charge fill, which was
   clipping its own pseudo-element clean off. */
#nitro::before{
  content:"";position:absolute;left:calc(var(--tip) - var(--nozzle));top:50%;
  transform:translateY(-50%);
  width:13px;height:14px;border-radius:1px 2px 2px 1px;
  background:linear-gradient(to bottom,#e2c98a,#a8843c 55%,#5f4718);
  box-shadow:inset 0 1px 0 rgba(255,240,200,.7), -1px 0 0 rgba(0,0,0,.35);
  z-index:1;
}
#nitro.on::before{ filter:brightness(1.45) }
/* the tip: a short taper past the valve, with a dark bore down the middle */
/* the tapered outlet, beyond the valve and pointing away from the bottle */
#nitro::after{
  content:"";position:absolute;left:calc(var(--nozzle) * -1);top:50%;
  transform:translateY(-50%);
  width:var(--tip);height:7px;
  background:linear-gradient(to bottom,#d8d2c4,#8a8f98 55%,#41464e);
  clip-path:polygon(100% 0, 0 22%, 0 78%, 100% 100%);
}
#nitro.on::after{ filter:brightness(1.5) }
/* ---- THE LABEL IS THE BOTTLE'S OWN (owner, 2026-08-31) --------------------
   The strap band that used to cross the middle is GONE. It was there so the
   shape read as a bottle rather than a pill, and the word does that job better:
   a dark bar sat over the charge gauge, so the one thing the bottle exists to
   show was interrupted by decoration at 52% of its own length.

   AND THE WORD IS BIGGER. It was 9px on a 30px bottle, which is a caption
   rather than a label - a real bottle carries its name across the barrel. */
#nitro b{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);

/* A POST HORN, drawn from the reference: the bell is a flat vertical mouth on
   the left, the tube sweeps away to the right and narrows, and the coiled loop
   hangs below it as an open ellipse. Nothing about it can be mistaken for a
   speaker, because a speaker has no loop. */
#horn i::after{

          mask:var(--hornmark) center/contain no-repeat;

/* Left-handed moves the CLUSTER, it does not mirror the pedals. Accelerator is
   the right pedal and brake is the left pedal in every car ever built, so
   swapping them for a left-handed player is exactly wrong. Only the bottle,
   the horn and the box position move. */
body.pedals-left #pedals{ right:auto; left:calc(env(safe-area-inset-left,0px) + 10px) }
body.pedals-left #nitro{ right:auto; left:0 }

/* no touch, no pedals — a desktop showing them looks broken */
/* Desktop has a keyboard, so the thumb controls are dead weight and look
   broken. The GAUGES stay — they are instruments, not controls — and the
   dials drop to the bottom of the cluster since there is nothing beneath
   them any more. */
/* Hide the CONTROLS, not the container. `#pedals` is the bottle's parent, so
   hiding the box took the gauge with it and it measured zero on desktop. */
body.no-touch #gas,
body.no-touch #brake,
body.no-touch #horn,
body.no-touch #shifter{ display:none }
body.no-touch #pedals{ pointer-events:none }
/* The bottle is a GAUGE as much as a button — it is the nitrous level — so it
   stays on desktop, just not as something you press. */
body.no-touch #nitro{
  display:block;pointer-events:none;
  right:calc(env(safe-area-inset-right,0px) + 8px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 86px * var(--ark-ui,1));
  left:auto;
}

body.no-touch #dials,
body.no-touch.manual /* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */

/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,

/* ---- the shifter ---------------------------------------------------------
   A six-speed H-gate: two rails with three positions each, and reverse below.
   The knob is dragged between them. It sits above the pedals so the same
   thumb can reach it without leaving the wheel hand.
   -------------------------------------------------------------------------- */
/* ---- the instrument binnacle -------------------------------------------
   Two round dials side by side: revs on the left, road speed on the right,
   the way they sit in a car. The linear bar and the separate MPH text were
   two different idioms doing the same job in two different places.
   -------------------------------------------------------------------------- */
/* The cluster stacks bottom-up: pedals, bottle, then the shifter ONLY when the
   manual box is on, then the dials. The dials used to sit at a fixed height and
   the shifter was drawn over them; each now takes its place in the stack and
   the dials drop back down when there is no shifter to clear. */
/* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */

/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,

#dials{
  position:absolute;z-index:13;pointer-events:none;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 8px);
  /* THE OFFSETS HAVE TO LIVE IN THE SAME SCALED SPACE. The bottle sits inside
     #pedals and is scaled by --ark-ui, so ITS distance off the bottom grows
     with the scale — while these were fixed pixels. At any scale above 1 the
     bottle rose into the dials and they covered a third of it. Multiplying the
     offsets by the same variable keeps the stack together at every size. */
  bottom:calc(env(safe-area-inset-bottom,0px) + (104px + var(--bottle,36px)) * var(--ark-ui,1));
  width:115px;height:59px;
  transition:bottom .18s ease-out;
}
body.manual #dials{
  bottom:calc(env(safe-area-inset-bottom,0px) + (204px + var(--bottle,36px)) * var(--ark-ui,1));
}
/* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */

/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,

#dials canvas{width:115px;height:59px;display:block}

/* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */
#wheel{
  /* Invisible until a thumb arrives. It has no business sitting in the corner
     of the road when nobody is holding it — it fades in on the first touch and
     back out when you let go. */
  opacity:0;
  transition:opacity .16s ease-out, left .10s ease-out, bottom .10s ease-out;
  position:absolute;z-index:12;
  left:calc(env(safe-area-inset-left,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  width:115px;height:115px;
  touch-action:none;
  transition:left .10s ease-out, bottom .10s ease-out;
}
/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,
body.hardware #shifter{ display:none }
body.hardware #pedals{ pointer-events:none }

/* This lost its `body.pedals-left` prefix in an earlier edit, so the LEFT-HANDED
   rule applied to everyone and the dials sat on the left for every player. */
body.pedals-left #dials{ right:auto; left:calc(env(safe-area-inset-left,0px) + 8px) }
/* and the wheel swaps to the other corner with them */
body.pedals-left #wheel{ left:auto; right:calc(env(safe-area-inset-right,0px) + 10px) }

#tacho::after{

#shifter{
  position:absolute;z-index:13;pointer-events:auto;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + (104px + var(--bottle,36px)) * var(--ark-ui,1));
  /* ---- THE PLATE IS THE GATE, PLUS THE KNOB, PLUS ITS PADDING (RLG-069)
     Three hand-set widths that did not follow from anything: 86 for a
     six-speed, 92 for a five and 74 for a four - so a FIVE-SPEED gate was
     drawn wider than a six-speed's, which is the one thing it cannot be.
     The rails are 23 apart and the knob is 28 across, so the plate is the
     last rail's knob position plus the same 8 of padding it has on the left:
     54 + 28 + 8 for three rails, 31 + 28 + 8 for two. -------------------- */
  width:90px;height:94px;touch-action:none;
}
#shifter[hidden]{ display:none }

/* ---- THE PADDLES -------------------------------------------------------
   A formula car has no gate and no knob to move through one — it has two
   paddles behind the wheel and a number between them. Same corner, same
   scale, so the thumb goes where it already went. */
#paddles{
  position:absolute;z-index:13;pointer-events:auto;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + (104px + var(--bottle,36px)) * var(--ark-ui,1));
  width:132px;height:64px;touch-action:none;
  display:flex;align-items:stretch;gap:6px;
}
#paddles[hidden]{ display:none }
body.no-touch #paddles,
body.hardware #paddles{ display:none }
#paddles button{
  flex:1;border:1px solid rgba(255,179,71,.55);
  background:linear-gradient(180deg,rgba(60,42,26,.92),rgba(28,20,14,.92));
  color:#ffd9a6;font:700 22px/1 var(--disp);border-radius:6px;
  -webkit-tap-highlight-color:transparent;touch-action:none;
}
#paddles button:active{ background:rgba(255,179,71,.35);color:#1a1208 }
/* the readout is gone; the two paddles share the width between them */
#gate{
  position:absolute;inset:0;border-radius:9px;
  background:linear-gradient(to bottom,#1a1d22,#0d0f13);
  border:1px solid #333941;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 6px 16px -6px #000;
}
/* the H itself, cut into the plate */
#gate::before, #gate::after{
  content:"";position:absolute;background:#05070a;border-radius:7px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9);
}
/* ---- THE PATTERN IS CENTRED IN THE PLATE (RLG-069) ----------------------
   Owner, 2026-08-30: "The 4-speed needs to be centered in its housing."

   It was not, and neither was the six-speed - the rails began at 13 and the
   plate ran on past the last one, so every gate sat left of centre. The knob
   was 4px out as well, which is the same fault seen from the other side: the
   knob is 28 across and the rail 10, so a rail centred under its knob starts
   9px to the right of it, and the knob positions were already 8, 31, 54.

   One number does all of it. The rails begin at 8 + 9 = 17, the plate is the
   knob's travel plus 8 of padding at each end, and the cross rail runs from
   the first rail's left edge to the last one's right edge - which comes out as
   the same 17 on both sides of both plates, because both plates are built the
   same way. -------------------------------------------------------------- */
#gate::before{ left:17px;right:17px;top:38px;height:10px }
/* three rails, six slots */
#gate::after{ left:17px;width:10px;top:11px;bottom:11px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9),
             23px 0 0 #05070a,
             46px 0 0 #05070a }
/* ---- A FOUR-SPEED HAS TWO RAILS, NOT THREE --------------------------------
   The gate drew three rails and six slots for every car, so a LORRY and a
   MUSCLE car — both four-speeds — were shown a pattern with gears they do not
   have. The rails are box-shadow copies offset 23px, so dropping one gives a
   five-speed and dropping two a four-speed, and the plate narrows to match.
   -------------------------------------------------------------------------- */
/* ---- AND A FIVE-SPEED SHOWS FIVE POSITIONS (RLG-069) -------------------
   Owner, 2026-08-30: "We need to make sure that the 5-speed only shows the 5
   positions."

   It showed six and left the sixth reading NEUTRAL, which is a gearbox fact
   dressed up as a picture: the player sees a slot and finds nothing in it. A
   five-speed's third rail runs from fifth DOWN TO THE CROSS RAIL and stops.
   So the shadow copies draw two full rails and the third is its own stub - a
   different height, which is the one thing a box-shadow copy cannot be.
   -------------------------------------------------------------------- */
body.gears4 #gate::after,
body.gears5 #gate::after{
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9),
             23px 0 0 #05070a;
}
body.gears5 #shifter::after{
  content:"";position:absolute;left:63px;top:11px;width:10px;height:37px;
  background:#05070a;border-radius:7px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9);
  pointer-events:none;
}
body.gears4 #shifter{ width:67px }

/* ---- A WORKING CAR HAS A BLACK KNOB (RLG-069) --------------------------
   Owner, 2026-08-30: "I also want production and utility vehicles to have a
   black leather or plastic shifter with white text on it."

   The polished ball is what a sports car has. A saloon, a cab, a pickup, a van
   and a lorry have a moulded black one with the pattern printed on it in white
   - and it is the same shape and the same size, because it is the same control
   with a different finish. The highlight is small and high, the way it is on
   moulded plastic, rather than the broad specular sweep of chrome.
   ---------------------------------------------------------------------- */
body.workknob #knob{

/* ------------ overlay ------------ */
/* Nothing in an overlay may reach past it. The title is set in a display
   face that may or may not have loaded — a fallback with wider metrics used
   to push the word off the side of the screen, and it is invisible on any
   machine where the real font is available. Cap everything and let long words
   break rather than trusting the typeface. */

#veil *{max-width:100%;overflow-wrap:anywhere}
#veil h1{overflow-wrap:break-word;hyphens:auto}
/* ---- A LONG PANEL SCROLLS -----------------------------------------------
   `place-items:center` centres a panel taller than the viewport, which pushes
   BOTH ends off screen — so the last buttons in the garage were unreachable on
   a short phone. It centres while it fits and scrolls when it does not, and the
   bottom padding clears the home indicator.
   ------------------------------------------------------------------------- */
#veil{position:absolute;inset:0;z-index:30;display:grid;place-items:center;
  justify-items:center;align-content:safe center;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:24px 24px calc(env(safe-area-inset-bottom,0px) + 28px);
  /* OPAQUE. A road running behind the menu is motion nobody asked for while
     they are reading stats, and it kept the whole simulation warm for no
     reason. Solid, with a soft vignette so it is not a flat slab. */
  background:radial-gradient(120% 80% at 50% 40%,#1b1424 0%,#0d0912 62%,#07050b 100%);
  text-align:center}
#veil.hidden{display:none}

/* ONE ROW, always. Twelve fixed-width circles at any gap will wrap on a
   narrow phone, so they are sized as a FRACTION of the row instead: a grid of
   twelve equal columns that shrinks with the screen rather than spilling. */
/* ---- A SWATCH IS A SWATCH -----------------------------------------------
   `repeat(var(--sw), 1fr)` divided the row by the NUMBER of colours, so the
   cruiser's two filled half the width each — two dinner plates where every
   other car has a row of buttons.

   The track width is fixed to a twelfth of the row instead, and the grid is
   centred. Two swatches are then the same size as twelve, sitting in the
   middle, and nothing has to know how many there are.
   ------------------------------------------------------------------------ */
.swatches{display:grid;
  grid-template-columns:repeat(var(--sw,12), calc((100% - 11*4px)/12));
  justify-content:center;gap:4px;
  align-items:center;margin:12px 0 4px}
.sw{width:100%;aspect-ratio:1;border-radius:50%;
  border:2px solid rgba(255,255,255,.20);cursor:pointer;padding:0;
  min-width:0}

  padding:6px 0 2px;text-align:center}
.gbox{display:flex;align-items:stretch;margin-top:12px}
.gbox .go{flex:1;border-radius:0;margin:0;border-right-width:0}
.gbox .go:first-child{flex:0 0 46px;border-radius:3px 0 0 3px}
.gbox .go:last-child{flex:0 0 46px;border-radius:0 3px 3px 0;border-right-width:1px}
/* the whole cluster reads as one control: no gaps, shared edges, and the
   DRIVE button closes it off at the bottom */
.gstack{display:flex;flex-direction:column;margin-top:0}
.gstack .go{border-radius:0;margin:0;border-top-width:0}
.gstack .go:last-child{border-radius:0 0 3px 3px}
/* ---- A CONTROL THAT IS SHUT RATHER THAN MISSING (RLG-115) -----------------
   A production or utility car can only go on TEST DRIVE, and the owner's
   answer was that the race modes GREY OUT WITH THE REASON GIVEN rather than
   disappearing. So this has to read as switched off and still legible - a
   control the player can see the shape of, with the `.gnote` under it saying
   which class shut it. `cursor:default` because there is nothing to press.
   ------------------------------------------------------------------------- */
.gstack .go.shut{opacity:.42;filter:grayscale(.65);cursor:default}

/* ---------------------------------------------------------------------------
   PORTRAIT ON A PHONE, WIDE ON A DESKTOP

   The manifest pins the INSTALLED app to portrait, but a browser tab cannot be
   forced — `screen.orientation.lock()` only works from fullscreen and throws
   everywhere else. So: on a touch device held sideways, a panel asks for it
   back. On a desktop there is no such thing as the wrong orientation, and a
   wide window is exactly what we want, so the panel never appears there.

   The test is POINTER TYPE, not width. A landscape phone and a small laptop
   window are the same number of pixels and want opposite things.
   --------------------------------------------------------------------------- */
#rotate{
  position:fixed;inset:0;z-index:9000;display:none;
  place-items:center;text-align:center;padding:28px;
  background:#07050b;color:#e8e2f4;
  font-family:var(--px,ui-monospace,monospace);
}
#rotate b{display:block;font-size:12px;letter-spacing:.22em;color:var(--gold,#e8b23a);margin-bottom:14px}
#rotate span{display:block;font-size:10px;letter-spacing:.14em;color:#8a8296;line-height:2}
#rotate i{display:block;width:52px;height:82px;margin:0 auto 22px;
  border:2px solid rgba(232,178,58,.65);border-radius:8px;
  transform:rotate(90deg);animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,40%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
@media (orientation:landscape) and (pointer:coarse){
  body.lock-portrait #rotate{display:grid}
}

/* the title art sits behind the veil, and only for the title */
#titleArt{position:absolute;inset:0;z-index:29;display:none;width:100%;height:100%}
body.titling #titleArt{display:block}
body.trophying #titleArt{display:block}
body.trophying #veil{
  background:linear-gradient(180deg, rgba(6,4,10,.30) 0%, rgba(6,4,10,.10) 26%,
    rgba(6,4,10,.20) 48%, rgba(6,4,10,.80) 72%, rgba(6,4,10,.96) 100%);
  align-items:end;padding-bottom:30px}
/* with art behind it the veil only needs to darken the lower half for the
   buttons, not cover the picture */
body.titling #veil{
  background:linear-gradient(180deg,
    rgba(8,5,14,0) 0%, rgba(8,5,14,0) 40%,
    rgba(8,5,14,.55) 58%, rgba(8,5,14,.90) 78%, rgba(8,5,14,.96) 100%);
  /* ---- THE TITLE SITS AT THE BOTTOM ------------------------------------
     `align-items` places an item within its ROW; `align-content` places the
     rows. Adding `align-content:safe center` to #veil for the garage overflow
     therefore centred the title menu too, and align-items could not override
     it. The title needs both. */
  align-items:end;align-content:safe end;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
body.titling #veil .vw{margin:0}
body.titling #veil h1{display:none}
/* a bezel line, not a credit: small, dim, and out of the way at the very
   bottom where a cabinet actually carries it */
.legal{margin-top:14px;font-size:8px;letter-spacing:.14em;
  color:rgba(255,255,255,.26);text-align:center}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div>
      <div class="toprow">
        <!-- DISTANCE moved into the speedometer as a mechanical odometer. In
             RACE it comes back, because how far is left is the whole point. -->
        <div class="stat c" id="clockWrap"><span>TIME</span><b id="clock">60</b></div>
        <div class="stat c" id="wantedWrap" hidden><span>WANTED</span><b id="wanted"></b></div>
        <div class="stat c" id="radarWrap" hidden><span>RADAR</span><b id="radar"></b></div>
        <div class="stat c" id="distWrap" hidden><span>TO GO</span><b id="dist">0.0<i>MI</i></b></div>
        <div class="stat c" id="placeWrap" hidden><span>PLACE</span><b id="place">12/12</b></div>
      </div>
    </div>
    <div class="botrow">
      <!-- speed now lives on the dial, where a car keeps it -->
      <div class="bars">
        <!-- The two bars lived down here under the pedals, where the controls
             covered them. Damage is smoke off the bonnet now and nitrous is the
             fill in the bottle, so both read where you are already looking. -->
      </div>
    </div>
  </div>

  <div id="warn"></div>
  <canvas id="wheel" width="230" height="230" aria-label="Steering"></canvas>
  <div id="pedals">
    <button id="nitro" disabled aria-label="Nitrous"><i></i><b>NOS</b></button>
    <button id="gas" aria-label="Accelerator"><i></i></button>
    <button id="brake" aria-label="Brake"><i></i></button>
    <button id="horn" aria-label="Horn"><i></i></button>
  </div>
  <div id="dials">
    <canvas id="gauges" width="230" height="118"></canvas>
  </div>
  <div id="shifter" hidden>
    <div id="gate"></div>
    <div id="knob" data-gear="1"><b>1</b></div>
  </div>
  <!-- a formula car does not have a gate: two paddles and a number -->
  <!-- no gear number between them: the tacho already shows the gear, and a
       formula wheel has paddles, not a readout -->
  <div id="paddles" hidden>
    <button id="padDown" type="button">−</button>
    <button id="padUp" type="button">+</button>
  </div>
  <canvas id="titleArt"></canvas>
<div id="veil"><div class="vw" id="veilBody"></div></div>
</div></div>

<script>
/* ---- INTERSTATE -------------------------------------------------------------
   The whole engine lives in road.js, shared with Motorsport. Interstate is the
   PLAIN case: an endless road, distance in miles, no circuit. It therefore
   passes almost nothing — which is the point. Every seam it leaves unset
   falls through to the behaviour it always had.
   -------------------------------------------------------------------------- */
/* ---- AND THE ONE SEAM IT DOES SET (owner, 2026-08-31) ----------------------
   The rolling start, and it is the main difference between this machine and
   Motorsport. Interstate is the endless road: you are already driving when the
   run begins, so the count happens while the car is pinned at fifty and GO
   changes exactly one thing - who is steering. In a race the whole field rolls
   to the line at the same fifty, ahead of you.

   Motorsport says nothing here and therefore starts from a grid, standing, on
   the neutral launch and the rev window - which is what a circuit race is.
   -------------------------------------------------------------------------- */
ROAD({ id:'interstate', title:'Redline Interstate', rollStartMph:50 });
</script>

<div id="rotate"><div><i></i><b>TURN YOUR PHONE</b>
<span>EFFIGY ARCADE IS PLAYED UPRIGHT</span></div></div>
<script>
/* only a device with a coarse pointer gets the portrait lock — a desktop
   window is free to be any shape, and wide is the better shape there */
(function(){
  if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('lock-portrait');
  /* an installed app can genuinely lock; a tab cannot, and throwing is fine */
  try{ if(screen.orientation && screen.orientation.lock)
        screen.orientation.lock('portrait').catch(function(){}); }catch(e){}
})();
</script>
</body>
</html>
