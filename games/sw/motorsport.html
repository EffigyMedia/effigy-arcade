     to turn hard to thread them, and the radius it can achieve is set by how
     far apart they are. Clustering is the geometry; depth is not.
     ------------------------------------------------------------------- */
  const ang = [], rad = [], hair = [];
  let a = 0;
  for(let i = 0; i < N; i++){
    /* how much of the circle this point takes. A cluster takes very little,
       which is exactly what makes the corner between them tight. */
    let share = 1 + srnd(-0.30, 0.30);
    ang.push(a);
    const lobe = (i % 2 ? -1 : 1) * spec.jitter * srnd(0.55, 1.0);
    rad.push(1 + lobe + srnd(-spec.jitter*0.30, spec.jitter*0.30));
    a += share;
  }

  /* ---- fold in the hairpins -------------------------------------------
     Take a point, pull it IN, and pull its two neighbours in ANGLE hard
     toward it. Three points at a short radius within a narrow arc is a
     hairpin: a wide approach, a tight apex, a wide exit. */
  /* ---- A CORNER NEEDS LENGTH, NOT A SHARP POINT ------------------------
     Measured on a warm lap, a formula car never dropped below 192mph. The
     corners were sharp — peak curvature 14 — and far too SHORT to matter: at
     218mph the car crosses a 600-unit sample in 0.036 seconds and the brakes
     take almost nothing off it, so it carries straight through the apex.

     A tight radius over 200 units is a kink. Over 6,000 it is a corner you
     must brake for. So a hairpin is built as a SUSTAINED ARC: four or five
     control points held at the same short radius across a narrow band of
     angle. The spline threads them at a constant tight radius, which is what
     an apex actually is, and the length comes for free because the points are
     spread along the arc rather than piled on one spot.
     ------------------------------------------------------------------- */
  const nHair = Math.max(1, Math.round(N * spec.spike));
  const used = [];
  for(let h = 0; h < nHair; h++){
    const arc = srint(4, 5);                 /* points held at the apex */
    const i0  = srint(2, N - arc - 3);
    if(used.some(u => Math.abs(u - i0) < arc + 3)) continue;
    used.push(i0);
    hair.push(i0);

    /* the arc: every point at the SAME short radius, inside a narrow band of
       angle, so the spline has to hold a constant tight turn across all of
       them rather than spike at one */
    const apexR    = 1 - spec.jitter * srnd(0.80, 1.05);
    const bandFrom = ang[i0 - 1], bandTo = ang[i0 + arc];
    /* 0.30-0.44 folded hard enough to produce CUSPS — measured radii as low
       as 38 units, which is a spike in the spline, not a corner. It also put
       crossings back. 0.55-0.72 keeps the arc a real curve. */
    const band     = (bandTo - bandFrom) * srnd(0.55, 0.72);
    for(let q = 0; q < arc; q++){
      ang[i0 + q] = bandFrom + band * ((q + 1) / (arc + 1));
      rad[i0 + q] = apexR * (1 + srnd(-0.03, 0.03));
    }
    /* wide approach and exit, so it reads as a hairpin rather than a dent */
    rad[i0 - 1]   = 1 + spec.jitter * srnd(0.75, 1.15);
    rad[i0 + arc] = 1 + spec.jitter * srnd(0.75, 1.15);
  }

  /* normalise the angles back onto a full circle */
  const span = ang[N-1] + 1;
  for(let i = 0; i < N; i++) ang[i] = (ang[i] / span) * Math.PI * 2;

  /* ---- sample the loop into a smooth path ------------------------------
     A Catmull-Rom through the control points, closed, so the track flows
     rather than turning at corners. */
  const P = [], STEPS = 24;
  const at = i => {
    const k = ((i % N) + N) % N;
    return [ Math.cos(ang[k]) * rad[k] * spec.size,
             Math.sin(ang[k]) * rad[k] * spec.size ];
  };
  for(let i = 0; i < N; i++){
    const p0 = at(i-1), p1 = at(i), p2 = at(i+1), p3 = at(i+2);
    for(let t = 0; t < STEPS; t++){
      const u = t / STEPS, u2 = u*u, u3 = u2*u;
      P.push([
        0.5*((2*p1[0]) + (-p0[0]+p2[0])*u + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),
        0.5*((2*p1[1]) + (-p0[1]+p2[1])*u + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3)
      ]);
    }
  }

  /* ---- CORNERS OF A CHOSEN RADIUS ---------------------------------------
     Stretching a corner made it longer at the SAME radius, which does nothing:
     a corner a formula car can take at 192mph does not slow it below 192
     however long it is. It also tripled the lap to 630km.

     Reverted. The radius has to come DOWN, and the only way to guarantee a
     radius is to draw one. For each hairpin, the span of path points is
     replaced by points lying on an explicit CIRCLE of the radius we want,
     tangent to the path at both ends — Cartesian geometry, not a polar nudge.

         v = 200 * sqrt(1 / (k * cornerG * 2.2))     the cap a curvature gives
         k = 1 / (R * 0.00028)                       curvature from a radius

     **k depends on the radius and NOTHING else** — not on how finely the arc
     is sampled, not on how long it lasts. That is why every previous attempt
     failed: stretching, clustering and squeezing all changed the sampling and
     left the radius alone.

     Solving it gives the band the generator has never produced:

         RADIUS      k      FORMULA    ROADSTER
          3000     1.19      218mph     176mph   — not a corner at all
          1600     2.23      212        142
           900     3.97      159        106
           600     5.95      130         87
           420     8.50      109         73
           320    11.16       95         63
           240    14.88       82         55

     I had been asking for 2,600. A hairpin is 320. It is a small number
     against a 74,000-unit track — and so is a real hairpin against a real
     circuit.
     -------------------------------------------------------------------- */
  {
    const turnAt = (i2) => {
      const a = P[(i2-1+P.length)%P.length], b = P[i2], c = P[(i2+1)%P.length];
      const h1 = Math.atan2(b[0]-a[0], b[1]-a[1]);
      const h2 = Math.atan2(c[0]-b[0], c[1]-b[1]);
      let d = h2-h1;
      while(d> Math.PI) d -= Math.PI*2;
      while(d<-Math.PI) d += Math.PI*2;
      return d;
    };
    /* the sharpest few places on the lap become real hairpins */
    const mag = P.map((_,i2) => Math.abs(turnAt(i2)));
    const rank = mag.map((v,i2)=>[v,i2]).sort((a,b)=>b[0]-a[0]);
    const picked = [];
    for(const [,i2] of rank){
      if(picked.length >= spec.hairpins) break;
      if(picked.some(q => Math.abs(q - i2) < 14)) continue;
      picked.push(i2);
    }

    for(const i2 of picked){
      const SPAN = 9;                       /* points either side we may move */
      const a = P[(i2-SPAN+P.length)%P.length];
      const b = P[(i2+SPAN)%P.length];
      const sign = turnAt(i2) < 0 ? -1 : 1;
      /* the chord across the corner, and its midpoint */
      const mxp = (a[0]+b[0])/2, myp = (a[1]+b[1])/2;
      const dx = b[0]-a[0], dy = b[1]-a[1];
      const chord = Math.hypot(dx, dy);
      if(chord < 1) continue;
      /* a circle through a and b with the radius we asked for */
      const Rt = Math.max(chord*0.52, spec.hairpinR);
      /* nothing on this track may be tighter than the hairpin we drew — a
         leftover cusp of radius 265 is not a corner, it is a spike that stops
         the car dead and is invisible at speed */
      const h = Math.sqrt(Math.max(0, Rt*Rt - (chord/2)*(chord/2)));
      const nx = -dy/chord, ny = dx/chord;
      const cx2 = mxp + nx*h*sign, cy2 = myp + ny*h*sign;
      const a0 = Math.atan2(a[1]-cy2, a[0]-cx2);
      let a1 = Math.atan2(b[1]-cy2, b[0]-cx2);
      let sweep = a1 - a0;
      while(sweep >  Math.PI) sweep -= Math.PI*2;
      while(sweep < -Math.PI) sweep += Math.PI*2;
      /* go the LONG way round, which is what makes it a hairpin */
      if(Math.sign(sweep) !== -Math.sign(sign)) sweep -= Math.sign(sweep)*Math.PI*2;
      for(let q = 1; q < SPAN*2; q++){
        const t = q/(SPAN*2);
        const ang2 = a0 + sweep*t;
        const idx = (i2 - SPAN + q + P.length) % P.length;
        P[idx] = [ cx2 + Math.cos(ang2)*Rt, cy2 + Math.sin(ang2)*Rt ];
      }
    }
  }

  /* ---- read the curvature off the closed path --------------------------
     Walk it, measure the turn between consecutive headings, and emit a
     segment per sample. The road is then EXACTLY the shape above, so the
     minimap and the driving agree by construction. */
  const segs = [];
  let len = 0;
  for(let i = 0; i < P.length; i++){
    const a = P[i], b = P[(i+1) % P.length], c = P[(i+2) % P.length];
    const h1 = Math.atan2(b[0]-a[0], b[1]-a[1]);
    const h2 = Math.atan2(c[0]-b[0], c[1]-b[1]);
    let d = h2 - h1;
    while(d >  Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    /* ---- THE FLOOR WAS EATING THE HAIRPINS -------------------------------
       `k = turn / (len * CURVE_K)`, so clamping len UP crushes k down. A
       hairpin's points sit 59 units apart; the floor called that 400 and
       turned a curvature of 10.6 into 1.56 — which is a motorway sweeper.

       Every geometric fix I made was correct and then thrown away on this
       line. The floor exists to stop a divide-by-zero, so it only has to be
       small enough not to matter: 12 units, not 400.
       ------------------------------------------------------------------ */
    const segLen = Math.max(12, Math.hypot(b[0]-a[0], b[1]-a[1]));
    /* k is the curvature the driving code expects: turn per unit of road */
    /* ---- NO CORNER TIGHTER THAN THE TIGHTEST ONE WE DESIGNED ------------
       Measured minimum radius was 265 where the hairpins asked for 3,800 — so
       leftover spline cusps were the real slowest point on every lap, and
       they are the ones that dropped the car to 31mph. A cusp is not a
       corner: it is one sample wide and invisible at speed.

       `kMax` is the curvature of the tightest hairpin the league asked for.
       Nothing may exceed it, so the slowest point on the lap is a corner
       somebody designed.
       ------------------------------------------------------------------ */
    const kRaw = d / (segLen * CURVE_K);
    const kMax = 1 / (spec.hairpinR * CURVE_K);
    segs.push({ k: Math.max(-kMax, Math.min(kMax, kRaw)), len: segLen });
    len += segLen;
  }

  const hills = [];
  let hl = 0;
  while(hl < len){
    const g = { k: srnd(-0.9, 1.1), len: Math.min(srnd(6000, 14000), len - hl) };
    hills.push(g); hl += g.len;
  }

  /* corners: runs of sustained curvature, which is what a driver would count */
  let corners = 0, inCorner = false;
  for(const g of segs){
    const tight = Math.abs(g.k) > 1.1;
    if(tight && !inCorner) corners++;
    inCorner = tight;
  }

  return { segs, hills, len, corners, path2: P,
           name: (league === 'gp' ? 'CIRCUIT ' : league === 'gt' ? 'PARK ' : 'MOTORSPORT ')
                 + (1000 + ((seed || srnd()*9000)|0) % 9000) };
}

/* ---- THE MINIMAP ---------------------------------------------------------
   A circuit is a list of (curvature, length). Walk it, turning by `k` as you
   go, and you get the shape of the track as a closed polyline — exactly the
   outline in a Crash Team Racing track select.

   Two details make it work:

     - the walk must CLOSE. Random curvature does not return to its start, so
       the total turn is measured and the whole path is rotated back by the
       error, spread over its length. The loop then joins itself.
     - it is normalised into a unit box, so the same code draws a long fast
       circuit and a tight one at the same size on screen.

   Built ONCE per circuit and cached; drawing it every frame is just a
   `drawImage` and a blip per car.
   -------------------------------------------------------------------------- */
function buildMiniPath(c){
  /* ---- THE MAP IS THE SOURCE SHAPE ------------------------------------
     The circuit is now BUILT from a closed path, so the map does not have to
     reconstruct one by integrating curvature and hoping it lands back where it
     started. It draws `path2` — the very points the road was read from.

     That removes the last way the picture and the track could disagree, which
     is what let a crossing appear on screen while the counter said zero.
     ------------------------------------------------------------------- */
  const pts = c.path2;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const q of pts){ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0];
                       if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; }
  const w = Math.max(1,x1-x0), h = Math.max(1,y1-y0), sc = 1/Math.max(w,h);
  return pts.map((q,i) => [ (q[0]-x0)*sc + (1-w*sc)/2,
                            (q[1]-y0)*sc + (1-h*sc)/2,
                            i / pts.length * c.len ]);
}

/* where on the map is a car at track position z */
function miniAt(z){
  if(!circuit || !circuit.path) return null;
  const P = circuit.path;
  const i = Math.min(P.length-1, Math.floor(trackZ(z) / circuit.len * P.length));
  return P[i];
}

function drawMiniMap(ctx2, mx, my, size){
  if(!circuit) return;
  if(!circuit.path) circuit.path = buildMiniPath(circuit);
  const P = circuit.path;
  ctx2.save();
  /* the board */
  ctx2.fillStyle = 'rgba(8,12,10,.62)';
  R.rr(ctx2, mx-4, my-4, size+8, size+8, 6); ctx2.fill();
  /* the ribbon: a fat dark casing with a pale road on top, as the map shows */
  const pt = i => [ mx + P[i][0]*size, my + P[i][1]*size ];
  ctx2.lineJoin = ctx2.lineCap = 'round';
  ctx2.strokeStyle = 'rgba(10,14,12,.95)';
  ctx2.lineWidth = Math.max(4, size*0.075);
  ctx2.beginPath();
  P.forEach((q,i) => { const a = pt(i); i ? ctx2.lineTo(a[0],a[1]) : ctx2.moveTo(a[0],a[1]); });
  ctx2.closePath(); ctx2.stroke();
  ctx2.strokeStyle = '#e9e6a8';
  ctx2.lineWidth = Math.max(2, size*0.045);
  ctx2.stroke();
  /* the start line, in red, exactly as the reference does it */
  const s0 = pt(0);
  ctx2.strokeStyle = '#e0332f';
  ctx2.lineWidth = Math.max(3, size*0.062);
  ctx2.beginPath();
  ctx2.moveTo(s0[0], s0[1]);
  const s1 = pt(Math.min(P.length-1, 2));
  ctx2.lineTo(s1[0], s1[1]);
  ctx2.stroke();
  /* every rival as a blip, then you on top so you are never hidden */
  for(const r of R.racers){
    const q = miniAt(r.z); if(!q) continue;
    ctx2.fillStyle = 'rgba(255,255,255,.78)';
    ctx2.beginPath();
    ctx2.arc(mx + q[0]*size, my + q[1]*size, Math.max(1.6, size*0.026), 0, 6.2832);
    ctx2.fill();
  }
  const me = miniAt(R.pos + R.PLAYER_Z);
  if(me){
    ctx2.fillStyle = '#0b0e0c';
    ctx2.beginPath();
    ctx2.arc(mx + me[0]*size, my + me[1]*size, Math.max(3, size*0.048), 0, 6.2832);
    ctx2.fill();
    ctx2.fillStyle = '#4dd6a0';
    ctx2.beginPath();
    ctx2.arc(mx + me[0]*size, my + me[1]*size, Math.max(2, size*0.034), 0, 6.2832);
    ctx2.fill();
  }
  ctx2.restore();
}

/* ---- THE MINIMAP ---------------------------------------------------------
   A circuit is a list of (curvature, length). Walk it, turning by `k` as you
   go, and you get the shape of the track as a closed polyline — exactly the
   outline in a Crash Team Racing track select.

   Two details make it work:

     - the walk must CLOSE. Random curvature does not return to its start, so
       the total turn is measured and the whole path is rotated back by the
       error, spread over its length. The loop then joins itself.
     - it is normalised into a unit box, so the same code draws a long fast
       circuit and a tight one at the same size on screen.

   Built ONCE per circuit and cached; drawing it every frame is just a
   `drawImage` and a blip per car.
   -------------------------------------------------------------------------- */

/* where on the map is a car at track position z */
function miniAt(z){
  if(!circuit || !circuit.path) return null;
  const P = circuit.path;
  const i = Math.min(P.length-1, Math.floor(trackZ(z) / circuit.len * P.length));
  return P[i];
}

function drawMiniMap(ctx2, mx, my, size){
  if(!circuit) return;
  if(!circuit.path) circuit.path = buildMiniPath(circuit);
  const P = circuit.path;
  ctx2.save();
  /* the board */
  ctx2.fillStyle = 'rgba(8,12,10,.62)';
  R.rr(ctx2, mx-4, my-4, size+8, size+8, 6); ctx2.fill();
  /* the ribbon: a fat dark casing with a pale road on top, as the map shows */
  const pt = i => [ mx + P[i][0]*size, my + P[i][1]*size ];
  ctx2.lineJoin = ctx2.lineCap = 'round';
  ctx2.strokeStyle = 'rgba(10,14,12,.95)';
  ctx2.lineWidth = Math.max(4, size*0.075);
  ctx2.beginPath();
  P.forEach((q,i) => { const a = pt(i); i ? ctx2.lineTo(a[0],a[1]) : ctx2.moveTo(a[0],a[1]); });
  ctx2.closePath(); ctx2.stroke();
  ctx2.strokeStyle = '#e9e6a8';
  ctx2.lineWidth = Math.max(2, size*0.045);
  ctx2.stroke();
  /* the start line, in red, exactly as the reference does it */
  const s0 = pt(0);
  ctx2.strokeStyle = '#e0332f';
  ctx2.lineWidth = Math.max(3, size*0.062);
  ctx2.beginPath();
  ctx2.moveTo(s0[0], s0[1]);
  const s1 = pt(Math.min(P.length-1, 2));
  ctx2.lineTo(s1[0], s1[1]);
  ctx2.stroke();
  /* every rival as a blip, then you on top so you are never hidden */
  for(const r of R.racers){
    const q = miniAt(r.z); if(!q) continue;
    ctx2.fillStyle = 'rgba(255,255,255,.78)';
    ctx2.beginPath();
    ctx2.arc(mx + q[0]*size, my + q[1]*size, Math.max(1.6, size*0.026), 0, 6.2832);
    ctx2.fill();
  }
  const me = miniAt(R.pos + R.PLAYER_Z);
  if(me){
    ctx2.fillStyle = '#0b0e0c';
    ctx2.beginPath();
    ctx2.arc(mx + me[0]*size, my + me[1]*size, Math.max(3, size*0.048), 0, 6.2832);
    ctx2.fill();
    ctx2.fillStyle = '#4dd6a0';
    ctx2.beginPath();
    ctx2.arc(mx + me[0]*size, my + me[1]*size, Math.max(2, size*0.034), 0, 6.2832);
    ctx2.fill();
  }
  ctx2.restore();
}

function trackZ(z){
  if(!circuit) return z;
  const L = circuit.len;
  return ((z % L) + L) % L;
}
function lapOf(z){ return circuit ? Math.floor(z / circuit.len) : 0; }

/* the sequence of bends, generated ahead as the road is consumed */
let signs = [];
function pushCurve(){
  const roll = Math.random();
  let k, len;
  if(roll < 0.30){ k = 0;                     len = R.rnd(7000, 15000); }
  else if(roll < 0.56){ k = R.rnd(0.9, 1.9);    len = R.rnd(6000, 12000); }
  else if(roll < 0.82){ k = R.rnd(2.4, 4.2);    len = R.rnd(5000, 10000); }
  else {                k = R.rnd(5.0, 8.0);    len = R.rnd(4000, 7000); }
  if(k && Math.random() < 0.5) k = -k;
  /* ---- warning boards ----------------------------------------------------
     A bend you cannot see coming is a trap rather than a corner. Every turn
     gets a board a little way before it, on the OUTSIDE of the bend where you
     are looking anyway, carrying one chevron for a gentle curve, two for a
     medium and three for a hard one. Straight from Out Run, and the reason its
     corners feel fair at speed.
     ------------------------------------------------------------------------ */
  const startZ = bendZ0 + totalLen(curveSegs);
  if(k !== 0){
    const mag = Math.abs(k) < 2.0 ? 1 : Math.abs(k) < 4.4 ? 2 : 3;
    signs.push({ z: startZ - 5200, dir: Math.sign(k), mag,
                 side: Math.sign(k) > 0 ? 1 : -1 });
  }
  curveSegs.push({ k, len });
  if(k !== 0) curveSegs.push({ k:0, len: R.rnd(3500, 7000) });
}


ROAD(Object.assign(CFG, {

  /* the two lookups that make the road a loop */
  curvature: z => circuit ? R.segAt(circuit.segs,  trackZ(z)) : 0,
  grade:     z => circuit ? R.segAt(circuit.hills, trackZ(z)) : 0,

  /* miles mean nothing on a circuit */
  hudScore:  () => {
    if(!circuit) return '\u2014';
    const d = fmtDelta(secDelta);
    const secTag = 'S' + (secIdx + 1) + (d ? ' ' + d : '');
    if(qualifying) return 'QUALIFYING \u00B7 ' + secTag;
    const f = Math.round(fuel), t = Math.round(tyre);
    const grid = qualDone ? ('   GRID P' + qualGrid) : '';
    return 'LAP ' + Math.min(lap + 1, lapsTotal) + '/' + lapsTotal
         + '   FUEL ' + f + '%   ' + COMPOUNDS[compound].name.charAt(0) + ' ' + t
         + '%   ' + secTag + grid;
  },

  /* a fresh track every run: that is what procgen is for */
  /* ---- MOTORSPORT'S OWN TITLE --------------------------------------------
     Interstate's title is a sunset at the end of an endless road, which is the
     wrong promise for a circuit racer. This is a track seen from ABOVE — the
     minimap idiom the game already uses, drawn large, with a car running a
     lap on it and the pit straight picked out in red.

     It uses the real generator, so the title screen is showing a circuit the
     game could actually deal you.
     ------------------------------------------------------------------- */
  /* cold chrome and track green, against Interstate's sunset chrome */
  /* ---- A PLACEHOLDER, AND SAID SO --------------------------------------
     The wordmark is still Interstate's warm chrome on a floodlit night scene,
     which is wrong — sunset metal against stadium light. Cool steel and a
     racing red are closer to the grid it now sits over, but this is a holding
     value, not a design. It wants proper lettering when there is time.
     ------------------------------------------------------------------- */
  logoCool: ['#f4f7fb','#aebccf','#e8eef7'],
  logoHot:  ['#ff9a86','#e8342f','#8f1410'],

  /* QUALIFY sits above DRIVE, because it comes first */
  garageButtons: () =>
    '<button class="go ghost" data-act="qualify">QUALIFY \u00B7 <b>' +
      (qualDone ? ('P' + qualGrid) : 'ONE LAP') + '</b></button>',
  garageActions: (start) => ({
    qualify: () => { startQualifying(); start(); }
  }),

  titleArt: (g, w, h, T) => {
    /* ---- THE GRID ---------------------------------------------------------
       Not a road to a sunset, and not a map. **The start grid**, seen from
       behind the last row: two staggered columns of cars on the painted boxes,
       the gantry overhead running its five reds, grandstands packed either
       side, floodlights above.

       It is the one image that is unmistakably a circuit racer and could not
       be mistaken for Interstate — there is no horizon to drive toward, only the
       moment before it starts.
       ------------------------------------------------------------------- */
    const hz = h * 0.40;

    /* ---- a floodlit night, not a sunset -------------------------------- */
    const sky = g.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0,   '#070b14');
    sky.addColorStop(0.55,'#101a2c');
    sky.addColorStop(1,   '#1d2c42');
    g.fillStyle = sky; g.fillRect(0, 0, w, hz);

    /* the floodlight pylons and their bloom */
    for(const fx of [0.14, 0.38, 0.62, 0.86]){
      const px = w*fx, py = hz*0.30;
      g.strokeStyle = '#1b2432'; g.lineWidth = Math.max(2, w*0.007);
      g.beginPath(); g.moveTo(px, py); g.lineTo(px, hz); g.stroke();
      g.fillStyle = '#2a3547';
      g.fillRect(px - w*0.045, py - h*0.016, w*0.090, h*0.020);
      for(let q = 0; q < 4; q++){
        g.fillStyle = 'rgba(255,250,225,.92)';
        g.beginPath();
        g.arc(px - w*0.032 + q*w*0.021, py - h*0.006, Math.max(1.4, w*0.007), 0, 6.2832);
        g.fill();
      }
      g.globalCompositeOperation = 'lighter';
      const bl = g.createRadialGradient(px, py, 0, px, py, w*0.22);
      bl.addColorStop(0, 'rgba(220,235,255,.20)');
      bl.addColorStop(1, 'rgba(220,235,255,0)');
      g.fillStyle = bl;
      g.beginPath(); g.arc(px, py, w*0.22, 0, 6.2832); g.fill();
      g.globalCompositeOperation = 'source-over';
    }

    /* ---- grandstands, packed, either side ------------------------------ */
    for(const side of [-1, 1]){
      const x0 = side < 0 ? 0 : w*0.66, ww = w*0.34;
      g.fillStyle = '#131a26';
      g.beginPath();
      g.moveTo(x0, hz);
      g.lineTo(x0, hz - h*0.11);
      g.lineTo(x0 + ww, hz - h*0.15);
      g.lineTo(x0 + ww, hz);
      g.closePath(); g.fill();
      /* the crowd: speckle that catches the floodlights */
      for(let q = 0; q < 260; q++){
        const rx = x0 + Math.random()*ww;
        const t2 = (rx - x0)/ww;
        const top = hz - h*(0.11 + t2*0.04);
        const ry = top + Math.random()*(hz - top);
        const tw = 0.35 + 0.65*Math.abs(Math.sin(q*3.1 + T*0.8));
        g.fillStyle = 'rgba(214,228,255,' + (0.16 + tw*0.30) + ')';
        g.fillRect(rx, ry, 1.6, 1.6);
      }
      g.fillStyle = '#26303f';
      g.fillRect(x0, hz - h*(side<0?0.115:0.155), ww, h*0.008);
    }

    /* ---- the tarmac ---------------------------------------------------- */
    const tar = g.createLinearGradient(0, hz, 0, h);
    tar.addColorStop(0, '#232734');
    tar.addColorStop(1, '#171a24');
    g.fillStyle = tar; g.fillRect(0, hz, w, h-hz);

    /* the track edges, converging */
    g.strokeStyle = 'rgba(255,255,255,.30)';
    g.lineWidth = Math.max(1.5, w*0.006);
    for(const side of [-1, 1]){
      g.beginPath();
      g.moveTo(w*0.5 + side*w*0.13, hz);
      g.lineTo(w*0.5 + side*w*0.92, h);
      g.stroke();
    }

    /* ---- the grid boxes ------------------------------------------------ */
    const ROWS = 5;
    /* the button panel starts around 0.74h, so the LAST row has to land above
       it — the grid was running under PLAY */
    const NEAR = 0.70;
    const rowY = r => hz + (h-hz) * NEAR * Math.pow((r+1)/(ROWS+1), 1.7);
    const rowW = r => w*0.13 + (w*0.62 - w*0.13) * Math.pow((r+1)/(ROWS+1), 1.7);
    for(let r = 0; r < ROWS; r++){
      const y = rowY(r), hw = rowW(r);
      const bw = hw*0.30, bh = (h-hz)*0.030*(0.5 + r*0.42);
      for(const side of [-1, 1]){
        const cx = w*0.5 + side*hw*0.46;
        g.strokeStyle = 'rgba(255,255,255,.55)';
        g.lineWidth = Math.max(1, hw*0.014);
        g.strokeRect(cx - bw/2, y - bh*(side<0?0:1.6), bw, bh*2.1);
      }
    }

    /* ---- the cars, staggered on the boxes ------------------------------ */
    const im = CFG.api && CFG.api.playerSprite && CFG.api.playerSprite();
    if(im){
      for(let r = ROWS-1; r >= 0; r--){
        const y = rowY(r), hw = rowW(r);
        for(const side of [-1, 1]){
          const cx = w*0.5 + side*hw*0.46;
          const cw = hw*0.34, ch = cw * im.height/im.width;
          const off = side < 0 ? 0 : -ch*0.30;      /* the stagger */
          g.save();
          g.globalAlpha = 0.35 + (r/(ROWS-1))*0.65;
          g.drawImage(im, cx - cw/2, y - ch + off, cw, ch);
          g.restore();
        }
      }
    }

    /* ---- the gantry and its lights ------------------------------------- */
    {
      /* the gantry stands OVER the grid, not among it — in front of the first
         row and high enough that the cars pass beneath */
      const gy = hz + (h-hz)*0.030;
      const hw = w*0.30;
      g.fillStyle = '#1a2130';
      g.fillRect(w*0.5 - hw*0.62, gy - h*0.026, hw*1.24, h*0.034);
      g.fillRect(w*0.5 - hw*0.64, gy - h*0.020, w*0.012, h*0.075);
      g.fillRect(w*0.5 + hw*0.62 - w*0.012, gy - h*0.020, w*0.012, h*0.075);
      const cyc = (T*0.6) % 5;
      for(let k2 = 0; k2 < 5; k2++){
        const lit = cyc < 4 ? (k2 < cyc) : false;
        g.fillStyle = cyc >= 4 ? '#38e878' : (lit ? '#ff2b3c' : 'rgba(90,32,40,.75)');
        g.beginPath();
        g.arc(w*0.5 + (k2-2)*hw*0.23, gy - h*0.009, Math.max(3, hw*0.055), 0, 6.2832);
        g.fill();
        if(lit || cyc >= 4){
          g.globalCompositeOperation = 'lighter';
          const q2 = g.createRadialGradient(w*0.5 + (k2-2)*hw*0.22, gy - h*0.007, 0,
                                            w*0.5 + (k2-2)*hw*0.22, gy - h*0.007, hw*0.18);
          q2.addColorStop(0, cyc >= 4 ? 'rgba(56,232,120,.40)' : 'rgba(255,43,60,.40)');
          q2.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = q2;
          g.beginPath(); g.arc(w*0.5 + (k2-2)*hw*0.22, gy - h*0.007, hw*0.18, 0, 6.2832); g.fill();
          g.globalCompositeOperation = 'source-over';
        }
      }
    }

    for(let y=0;y<h;y+=3){ g.fillStyle='rgba(0,0,0,.16)'; g.fillRect(0,y,w,1); }
    return true;
  },

  /* the bend is integrated over the road AHEAD; a circuit wraps, so a lap and
     a half is always enough to fill the view */
  /* the billboard angle is integrated with the same constant the road is */
  curveK: () => CURVE_K,

  roadSpan: () => circuit ? circuit.len * 1.5 : 0,

  /* a circuit is somewhere, and it stays there */
  biome: () => circuitBiome,
  onReset: () => {
    circuit = buildCircuit(league);
    const bk = R.BIOME_KEYS();
    circuitBiome = bk[(Math.random()*bk.length)|0];
    lap = 0; lapStart = R.clock; bestLap = 0; lastLap = 0;
    fuel = 100; tyre = 100; inPit = false; pitTime = 0; stops = 0;
    pitReset();
    resetSectors(true);
  },

  /* `pos` never resets, so the lap number is just how many track lengths you
     have covered. A change in that number IS a lap. */
  onStep: () => {
    stepPit();
    stepSectors();
    if(!circuit || R.state !== 'driving') return;
    const n = lapOf(R.pos);
    if(n > lap){
      const t = lapStart - R.clock;
      lastLap = t;
      if(t > 0 && (!bestLap || t < bestLap)) bestLap = t;
      lapStart = R.clock; lap = n;
      resetSectors(false);
      /* ---- ONE LAP, THEN IT IS OVER ------------------------------------
         In qualifying the first completed lap IS the session. */
      if(qualifying){ finishQualifying(); R.finished = true; return; }
      R.snd.checkpoint();
      if(lap >= lapsTotal && !R.finished){ R.finished = true; R.flashWarn('FINISH'); }
    }
  },

  afterDraw: (ctx) => {
    if(PIT.on) return;                        /* the box owns the screen */
    if(circuit && R.state === 'driving')
      drawMiniMap(ctx, 14, R.horizon() + 12, Math.min(96, innerWidth * 0.24));
  },

  /* the pit box paints LAST, over the mirror and the HUD — see CFG.overlay */
  overlay: (ctx) => {
    if(PIT.on) drawPitView(ctx);
    else if(PIT.released > 0) drawPitTime(ctx);
  }
}));
</script>
