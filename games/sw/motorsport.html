<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Redline Motorsport</title>
  <meta name="arcade-home" content="../../index.html">
  <!-- the storage scope: this machine's save, options, audio settings and
       intro record all hang off it, and all of them are erased together -->
  <meta name="arcade-id" content="motorsport">
  <meta name="arcade-title" content="Redline Motorsport">
<meta name="arcade-accent" content="#ff8a3d">
<script src="../../audio.js"></script>
<script src="../../arcade.js"></script>
<script src="../../road.js"></script>
<style>
/* Self-hosted — no network call at launch, so a wrapped native build
   and the offline PWA both render correctly. Generated by fonts.py.
   Variable families ship whole with a weight RANGE: instancing each
   weight separately produced files the browser silently refused. */
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:600;font-display:swap;src:url("../../fonts/sairacondensed-600.woff2") format("woff2")}
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:800;font-display:swap;src:url("../../fonts/sairacondensed-800.woff2") format("woff2")}
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-display:swap;src:url("../../fonts/archivo-var.woff2") format("woff2")}

:root{
  --sodium:#ff8a3d;
  --pale:#ffeede;
  --dim:rgba(255,238,222,.5);
  --red:#ff3355;
  --blue:#4d8cff;
  --cyan:#5ff0d8;
  --disp:"Saira Condensed","Arial Narrow",sans-serif;
  --lab:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;width:100%;position:fixed;overflow:hidden;background:#08050f;
  color:var(--pale);font-family:var(--lab);
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
}
#stage{position:absolute;inset:0;display:grid;place-items:center}
#frame{
  position:relative;overflow:hidden;background:#08050f;
  width:min(100dvw, calc(var(--stage-h, 100dvh) * 0.70));height:var(--stage-h, 100dvh);
}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ------------ HUD ------------ */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;
  /* the TOP padding is the safe area only - see the note in interstate.html */
  padding:var(--safe-top, env(safe-area-inset-top,0px)) 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;flex-direction:column;justify-content:space-between}
/* clear of the glass, measured against the glass: the engine publishes the
   mirror's height and margin, so this row moves when the mirror does (RLG-082) */
.toprow{ padding-top:calc(var(--mirror-top,6px) + var(--mirror-h,44px) + 8px * var(--ark-ui,1));
  display:flex;justify-content:space-between;align-items:flex-start}
.stat span{display:block;font-size:8.5px;font-weight:700;letter-spacing:.22em;color:var(--dim)}
.stat b{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat i{font-style:normal;font-size:11px;font-weight:600;color:var(--dim);margin-left:2px}
.stat.r{text-align:right}
.stat.c{text-align:center;flex:0 0 auto}
/* the clock is the loudest thing in the HUD, because it is the thing that
   ends the run */
#clockWrap b{font-size:30px;color:#ffb347;letter-spacing:.02em;
  text-shadow:0 0 18px rgba(255,179,71,.55)}
#clockWrap.low b{color:#ff5a4a;text-shadow:0 0 22px rgba(255,90,74,.75)}
/* ---- A GAUGE LIGHTS WHEN SOMETHING GOES INTO IT (RLG-126) -----------------
   A line in the middle of the screen is read once and gone; the clock and the
   bottle are what the player watches for the rest of the run. Lighting the
   thing the award went INTO teaches where to look rather than what to read,
   and it is the same mechanism the clock already uses to say it is running out
   - a class, and the colour it carries. `.gain` beats `.low` because a
   transform and a colour are different properties, so a top-up on the last
   five seconds reads as both at once, which is exactly what it is. */
#clockWrap.gain b{
  color:#7dffb0;text-shadow:0 0 24px rgba(125,255,176,.85);
  transform:scale(1.12);
}
#clockWrap b{ transition:color .18s linear, text-shadow .18s linear, transform .18s ease-out;
              display:inline-block }
#nitro.gain i{
  filter:brightness(1.5) saturate(1.15);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.6), inset 0 -6px 10px rgba(0,0,0,.35),
             0 0 14px rgba(125,255,235,.75), 0 4px 12px -3px #000;
}
#nitro i{ transition:filter .18s linear, box-shadow .18s linear }


/* pointer-events:none — this banner is full-width and sits ON TOP of the
   canvas, so while a warning was on screen (PIT LANE, WRONG WAY, BUSTED) it
   silently swallowed every tap that landed in its band. Nothing on it is
   interactive; it should never have been a target. */
/* ---- IT SITS UNDER THE INFORMATION ROW, NOT OVER THE ROAD (RLG-134) ----
   Owner, 2026-08-31: "the UI elements that pop up in the dead center of the
   screen block my view of the upcoming road, so I think we should move that to
   just under the other information that's below the rearview mirror."

   `top:38%` IS THE FAULT AND A PERCENTAGE IS WHY IT RECURS. A fraction of the
   screen lands wherever the screen happens to put it, so the banner sits on the
   road on one phone and clear of it on another. `--msg-top` is measured from
   `.toprow`'s own bottom and published by the engine each frame, which is the
   whole of what "anchored relative spacing" means: a distance follows the thing
   it is a distance FROM. The 38% survives only as the fallback for a frame
   before the first measurement.

   SMALLER, BECAUSE IT IS NO LONGER ALONE IN THE MIDDLE OF THE FRAME. It was
   sized to be read across an empty windscreen; under the mirror it shares the
   busiest band on the screen with the glass and the information row. */
#warn{
  position:absolute;left:0;right:0;top:var(--msg-top,38%);text-align:center;pointer-events:none;
  font-family:var(--disp);font-weight:800;font-size:clamp(15px,4.6vw,22px);letter-spacing:.10em;
  color:#fff;text-shadow:0 0 18px var(--red),0 2px 0 #7a0d20;opacity:0;
}
#warn.on{animation:wn 1.9s ease-out 1}
/* the pit box owns the screen */
body.in-pit #hud,
body.in-pit #wheel,
body.in-pit #pedals,
body.in-pit #dials,
body.in-pit #shifter,
body.in-pit #warn{display:none!important}
@keyframes wn{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:scale(1)}
              70%{opacity:1}100%{opacity:0}}

.botrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.speedo{display:flex;align-items:baseline;gap:5px}
.speedo b{font-family:var(--disp);font-weight:800;font-size:clamp(46px,15vw,68px);
  line-height:.8;font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(255,138,61,.45)}
.speedo span{font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--dim);padding-bottom:4px}
.bars{flex:1;max-width:140px;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:6px}
.bar em{font-style:normal;font-size:8px;font-weight:700;letter-spacing:.16em;color:var(--dim);width:26px}
.trk{flex:1;height:7px;background:rgba(255,238,222,.10);position:relative;overflow:hidden;
  transform:skewX(-18deg)}
.trk i{position:absolute;inset:0;width:0;display:block;transition:width .12s linear}
#dmgFill{background:linear-gradient(90deg,#7a2233,var(--red))}
#nosFill{background:linear-gradient(90deg,#1d6e73,var(--cyan))}

/* Both controls under one thumb on a steep diagonal: BRAKE low and outboard
   where the thumb rests, NOS above and inboard so it takes a deliberate reach.
   `body.pedals-left` mirrors the pair. */
/* ---- the pedal box ------------------------------------------------------
   Brake and accelerator side by side as actual pedals, hinged at the top and
   tilting when pressed. The nitrous is a bottle lying on its side ABOVE the
   accelerator, because pressing it means gas AND nitrous at once.
   -------------------------------------------------------------------------- */
/* The whole cluster was 150x186 with 62x122 pedals — it covered the player's
   own car and ran off the bottom of the screen. Everything is about 70% of
   what it was, tucked into the corner, and nothing overlaps anything else. */
#pedals{
  position:absolute;z-index:12;pointer-events:none;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:104px;height:126px;
}
#pedals button{
  position:absolute;pointer-events:auto;padding:0;border:0;background:none;
  -webkit-tap-highlight-color:transparent;
}
/* the two pedals: rubber pads on a steel arm, tilting on press */
#gas, #brake{
  bottom:0;width:46px;height:84px;
  perspective:170px;
}
#brake{ left:0 }
#gas{ right:0 }
#gas i, #brake i{
  display:block;width:100%;height:100%;border-radius:7px 7px 5px 5px;
  transform-origin:50% 0%;
  transition:transform .07s ease-out, filter .07s ease-out;
  background:
    repeating-linear-gradient(to bottom,
      rgba(255,255,255,.10) 0 3px, rgba(0,0,0,.22) 3px 7px),
    linear-gradient(to bottom, #3a3f47 0%, #23262c 55%, #15171b 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.22),
    inset 0 -6px 10px rgba(0,0,0,.6),
    0 5px 0 #0c0d10, 0 10px 16px -6px #000;
  border:1px solid #4a505a;
}
#brake i{ border-color:#6b3436; box-shadow:inset 0 2px 0 rgba(255,150,150,.22),
  inset 0 -6px 10px rgba(0,0,0,.6), 0 5px 0 #2a0e10, 0 10px 16px -6px #000 }
#gas i{ border-color:#3f5f42; box-shadow:inset 0 2px 0 rgba(170,255,180,.20),
  inset 0 -6px 10px rgba(0,0,0,.6), 0 5px 0 #0e2412, 0 10px 16px -6px #000 }
/* pressed: the pad rotates away and drops onto its stop */
#gas.on i, #brake.on i{ transform:rotateX(26deg) translateY(4px); filter:brightness(1.5) }
#brake.on i{ filter:brightness(1.35) saturate(1.5) }

/* the nitrous bottle, lying on its side over the accelerator */
/* a car with no bottle shows no bottle — the LORRY and the CAB had a nitrous
   button and a gauge they could never use */
body.nonos #nitro, body.nonos #nosWrap{ display:none !important }
#nitro{
  /* The dials and the gate were landing on top of it. 92px cleared the pedals
     but nothing above, so it needed the gap raising — not by much, or it
     drifts away from the thumb that presses it. */
  right:0;bottom:84px;width:72px;height:30px;
}

#nitro i{
  display:block;width:100%;height:100%;position:relative;overflow:hidden;
  /* The DOMED BASE is on the right and the tapered shoulder on the left,
     because that is the end the valve screws into — the nozzle was on the
     base, which is the one place a bottle has no opening at all. */
  border-radius:7px 16px 16px 7px;
  /* The bottle IS the gauge now — the old #nosFill bar sat under the pedals
     where nothing could see it. --nos is set every frame; the charge fills
     from the neck end and the empty part reads as dark glass. */
  background:
    /* drains from the valve end, so the charge you have left sits against the
       base — which is the way round a real bottle empties */
    linear-gradient(to right,
      rgba(8,30,32,.92) 0%,
      rgba(8,30,32,.92) calc(100% - var(--nos,40%)),
      transparent      calc(100% - var(--nos,40%))),
    linear-gradient(to bottom,#7ef0dc 0%,#2fbcae 42%,#0e5f60 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45), inset 0 -6px 10px rgba(0,0,0,.45),
             0 4px 12px -3px #000;
  border:1px solid rgba(140,255,238,.5);
}
/* The neck, valve and NOZZLE. It was a plain block on the end — a bottle needs
   somewhere for the gas to actually leave, so this is a brass valve body with a
   tapered nozzle tip beyond it. */
/* The brass valve body, on the NECK end. It lives on the BUTTON, not on the
   bottle: `#nitro i` carries `overflow:hidden` for the charge fill, which was
   clipping its own pseudo-element clean off. */
#nitro::before{
  content:"";position:absolute;left:-11px;top:50%;transform:translateY(-50%);
  width:13px;height:14px;border-radius:1px 2px 2px 1px;
  background:linear-gradient(to bottom,#e2c98a,#a8843c 55%,#5f4718);
  box-shadow:inset 0 1px 0 rgba(255,240,200,.7), -1px 0 0 rgba(0,0,0,.35);
  z-index:1;
}
#nitro.on::before{ filter:brightness(1.45) }
/* the tip: a short taper past the valve, with a dark bore down the middle */
/* the tapered outlet, beyond the valve and pointing away from the bottle */
#nitro::after{
  content:"";position:absolute;left:-20px;top:50%;
  transform:translateY(-50%);
  width:9px;height:7px;
  background:linear-gradient(to bottom,#d8d2c4,#8a8f98 55%,#41464e);
  clip-path:polygon(100% 0, 0 22%, 0 78%, 100% 100%);
}
#nitro.on::after{ filter:brightness(1.5) }
/* ---- THE LABEL IS THE BOTTLE'S OWN (owner, 2026-08-31) --------------------
   The strap band that used to cross the middle is GONE. It was there so the
   shape read as a bottle rather than a pill, and the word does that job better:
   a dark bar sat over the charge gauge, so the one thing the bottle exists to
   show was interrupted by decoration at 52% of its own length.

   AND THE WORD IS BIGGER. It was 9px on a 30px bottle, which is a caption
   rather than a label - a real bottle carries its name across the barrel. */
#nitro b{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;pointer-events:none;z-index:2;
  font-family:var(--disp);font-size:15px;font-weight:800;
  letter-spacing:.14em;color:#eafffb;
  text-shadow:0 1px 0 rgba(0,0,0,.6), 0 0 7px rgba(120,255,235,.5);
}
/* the horn: a chrome boss on the wheel, left of the pedals */
#horn{
  left:-46px;bottom:4px;width:40px;height:40px;
}

/* A POST HORN, drawn from the reference: the bell is a flat vertical mouth on
   the left, the tube sweeps away to the right and narrows, and the coiled loop
   hangs below it as an open ellipse. Nothing about it can be mistaken for a
   speaker, because a speaker has no loop. */
#horn i::after{
  content:"";position:absolute;inset:16%;
  background:rgba(24,28,34,.84);
  -webkit-mask:var(--hornmark) center/contain no-repeat;
          mask:var(--hornmark) center/contain no-repeat;
}
/* The chrome disc itself. My CSS tidy kept the LAST `#horn i` block — which
   only carried the mask variable — and dropped the one with the metal in it,
   so the button was still there and hit-testable but had nothing to see. */
#horn i{
  display:block;width:100%;height:100%;position:relative;border-radius:50%;
  background:
    radial-gradient(circle at 34% 28%, #ffffff 0%, #dfe4ec 22%, #9aa3b0 55%, #5c636e 82%, #3a4049 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -2px 3px rgba(0,0,0,.45),
    0 2px 5px rgba(0,0,0,.55);
  --hornmark:url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">\
<rect x="3.4" y="6.2" width="2.6" height="19.6" rx="0.5"/>\
<path d="M6.0 7.2c0.9 3.9 4.4 5.9 10.1 6.8 4.4 0.7 8.4 0.9 11.6 0.7 0.5-0.03 0.9 0.25 1.0 0.6l0-1.1c0-0.5 0.4-0.9 0.9-0.9v5.0c-0.5 0-0.9-0.4-0.9-0.9l0-1.0c-0.15 0.35-0.5 0.6-0.95 0.6-1.5-0.05-3.1-0.02-4.8 0.1l0-2.4c-3.0 0.15-6.6-0.05-10.6-0.7C7.6 12.7 4.6 10.6 3.4 6.9z"/>\
<path d="M6.0 24.8c0.75-3.2 3.3-5.1 7.4-6.1l0 2.5c-3.1 0.8-5.0 2.2-5.6 4.6z"/>\
<path d="M17.4 17.6c4.6 0 8.3 1.9 8.3 4.3s-3.7 4.3-8.3 4.3-8.3-1.9-8.3-4.3 3.7-4.3 8.3-4.3zm0 1.9c-3.4 0-6.1 1.1-6.1 2.4s2.7 2.4 6.1 2.4 6.1-1.1 6.1-2.4-2.7-2.4-6.1-2.4z"/>\
</svg>');
}
#horn.on i{ filter:brightness(1.35); transform:translateY(2px) }
body.pedals-left #horn{ left:auto; right:-58px }

#nitro:disabled{opacity:.32;filter:grayscale(.5)}
#nitro.on i{ filter:brightness(1.5); box-shadow:inset 0 3px 0 rgba(255,255,255,.6),
  0 0 22px rgba(95,240,216,.7), 0 4px 12px -3px #000 }

/* Left-handed moves the CLUSTER, it does not mirror the pedals. Accelerator is
   the right pedal and brake is the left pedal in every car ever built, so
   swapping them for a left-handed player is exactly wrong. Only the bottle,
   the horn and the box position move. */
body.pedals-left #pedals{ right:auto; left:calc(env(safe-area-inset-left,0px) + 10px) }
body.pedals-left #nitro{ right:auto; left:0 }

/* no touch, no pedals — a desktop showing them looks broken */
/* Desktop has a keyboard, so the thumb controls are dead weight and look
   broken. The GAUGES stay — they are instruments, not controls — and the
   dials drop to the bottom of the cluster since there is nothing beneath
   them any more. */
/* Hide the CONTROLS, not the container. `#pedals` is the bottle's parent, so
   hiding the box took the gauge with it and it measured zero on desktop. */
body.no-touch #gas,
body.no-touch #brake,
body.no-touch #horn,
body.no-touch #shifter{ display:none }
body.no-touch #pedals{ pointer-events:none }
/* The bottle is a GAUGE as much as a button — it is the nitrous level — so it
   stays on desktop, just not as something you press. */
body.no-touch #nitro{
  display:block;pointer-events:none;
  right:calc(env(safe-area-inset-right,0px) + 8px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 86px * var(--ark-ui,1));
  left:auto;
}

body.no-touch #dials,
body.no-touch.manual /* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */

/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,

/* ---- the shifter ---------------------------------------------------------
   A six-speed H-gate: two rails with three positions each, and reverse below.
   The knob is dragged between them. It sits above the pedals so the same
   thumb can reach it without leaving the wheel hand.
   -------------------------------------------------------------------------- */
/* ---- the instrument binnacle -------------------------------------------
   Two round dials side by side: revs on the left, road speed on the right,
   the way they sit in a car. The linear bar and the separate MPH text were
   two different idioms doing the same job in two different places.
   -------------------------------------------------------------------------- */
/* The cluster stacks bottom-up: pedals, bottle, then the shifter ONLY when the
   manual box is on, then the dials. The dials used to sit at a fixed height and
   the shifter was drawn over them; each now takes its place in the stack and
   the dials drop back down when there is no shifter to clear. */
/* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */

/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,

#dials{
  position:absolute;z-index:13;pointer-events:none;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 8px);
  /* THE OFFSETS HAVE TO LIVE IN THE SAME SCALED SPACE. The bottle sits inside
     #pedals and is scaled by --ark-ui, so ITS distance off the bottom grows
     with the scale — while these were fixed pixels. At any scale above 1 the
     bottle rose into the dials and they covered a third of it. Multiplying the
     offsets by the same variable keeps the stack together at every size. */
  bottom:calc(env(safe-area-inset-bottom,0px) + 132px * var(--ark-ui,1));
  width:115px;height:59px;
  transition:bottom .18s ease-out;
}
body.manual #dials{
  bottom:calc(env(safe-area-inset-bottom,0px) + 240px * var(--ark-ui,1));
}
/* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */

/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,

#dials canvas{width:115px;height:59px;display:block}

/* ---- the wheel ----------------------------------------------------------
   Bottom-left, opposite the pedals. It ROTATES with the car and it FOLLOWS the
   thumb: press anywhere in its quadrant and the wheel re-centres under your
   finger, so you never have to find it. Steering is by how far you drag from
   where you first pressed, which means the grab point is wherever you happen
   to land rather than a fixed hit target.
   -------------------------------------------------------------------------- */
#wheel{
  /* Invisible until a thumb arrives. It has no business sitting in the corner
     of the road when nobody is holding it — it fades in on the first touch and
     back out when you let go. */
  opacity:0;
  transition:opacity .16s ease-out, left .10s ease-out, bottom .10s ease-out;
  position:absolute;z-index:12;
  left:calc(env(safe-area-inset-left,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  width:115px;height:115px;
  touch-action:none;
  transition:left .10s ease-out, bottom .10s ease-out;
}
/* Every touch control follows the same rule, not just the wheel: with a
   keyboard or a pad in use the whole thumb cluster is clutter over the road. */
body.wheeling #wheel{ opacity:1 }
body.no-touch #wheel,
body.hardware #wheel,
body.hardware #gas,
body.hardware #brake,
body.hardware #horn,
body.hardware #shifter{ display:none }
body.hardware #pedals{ pointer-events:none }

/* This lost its `body.pedals-left` prefix in an earlier edit, so the LEFT-HANDED
   rule applied to everyone and the dials sat on the left for every player. */
body.pedals-left #dials{ right:auto; left:calc(env(safe-area-inset-left,0px) + 8px) }
/* and the wheel swaps to the other corner with them */
body.pedals-left #wheel{ left:auto; right:calc(env(safe-area-inset-right,0px) + 10px) }
#tachoOLD{
  position:absolute;z-index:13;display:none;
  border-radius:5px;background:#0d0f13;border:1px solid #333941;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.8);
  overflow:hidden;
}
#tacho i{
  position:absolute;left:2px;top:2px;bottom:2px;width:2px;border-radius:2px;
  background:#5ff0d8;
  box-shadow:0 0 7px rgba(95,240,216,.85);
  transform:translateX(var(--rev,0px));
  transition:transform .05s linear;
}
/* the last fifth is the red zone, painted on the plate itself */
#tacho::after{
  content:"";position:absolute;right:2px;top:2px;bottom:2px;width:18%;
  background:repeating-linear-gradient(115deg,
    rgba(255,60,80,.30) 0 3px, rgba(255,60,80,.10) 3px 6px);
  border-left:1px solid rgba(255,60,80,.5);
}
#tacho b{
  position:absolute;left:5px;top:50%;transform:translateY(-50%);
  font-family:var(--disp);font-size:9px;font-weight:800;color:#5c6570;
  letter-spacing:.06em;
}
#tacho.red i{ background:#ff3b5c; box-shadow:0 0 9px rgba(255,59,92,.9) }
#tacho.red b{ color:#ff8fa0 }

#shifter{
  position:absolute;z-index:13;pointer-events:auto;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 132px * var(--ark-ui,1));
  width:86px;height:94px;touch-action:none;
}
#shifter[hidden]{ display:none }

/* ---- THE PADDLES -------------------------------------------------------
   A formula car has no gate and no knob to move through one — it has two
   paddles behind the wheel and a number between them. Same corner, same
   scale, so the thumb goes where it already went. */
#paddles{
  position:absolute;z-index:13;pointer-events:auto;
  transform-origin:100% 100%;
  transform:scale(var(--ark-ui,1));
  right:calc(env(safe-area-inset-right,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 132px * var(--ark-ui,1));
  width:132px;height:64px;touch-action:none;
  display:flex;align-items:stretch;gap:6px;
}
#paddles[hidden]{ display:none }
body.no-touch #paddles,
body.hardware #paddles{ display:none }
#paddles button{
  flex:1;border:1px solid rgba(255,179,71,.55);
  background:linear-gradient(180deg,rgba(60,42,26,.92),rgba(28,20,14,.92));
  color:#ffd9a6;font:700 22px/1 var(--disp);border-radius:6px;
  -webkit-tap-highlight-color:transparent;touch-action:none;
}
#paddles button:active{ background:rgba(255,179,71,.35);color:#1a1208 }
/* the readout is gone; the two paddles share the width between them */
#gate{
  position:absolute;inset:0;border-radius:9px;
  background:linear-gradient(to bottom,#1a1d22,#0d0f13);
  border:1px solid #333941;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 6px 16px -6px #000;
}
/* the H itself, cut into the plate */
#gate::before, #gate::after{
  content:"";position:absolute;background:#05070a;border-radius:7px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9);
}
#gate::before{ left:13px;right:13px;top:38px;height:10px }          /* the cross rail */
/* three rails, six slots */
#gate::after{ left:13px;width:10px;top:11px;bottom:11px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9),
             23px 0 0 #05070a,
             46px 0 0 #05070a }
/* ---- A FOUR-SPEED HAS TWO RAILS, NOT THREE --------------------------------
   The gate drew three rails and six slots for every car, so a LORRY and a
   MUSCLE car — both four-speeds — were shown a pattern with gears they do not
   have. The rails are box-shadow copies offset 23px, so dropping one gives a
   five-speed and dropping two a four-speed, and the plate narrows to match.
   -------------------------------------------------------------------------- */
body.gears5 #gate::after{
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9),
             23px 0 0 #05070a,
             46px 0 0 #05070a;
}
body.gears5 #gate::before{ right:26px }        /* the cross rail stops short */
body.gears4 #gate::after{
  box-shadow:inset 0 2px 3px rgba(0,0,0,.9),
             23px 0 0 #05070a;
}
body.gears4 #gate::before{ right:36px }
body.gears4 #shifter{ width:74px }
body.gears5 #shifter{ width:92px }

#knob{
  position:absolute;width:28px;height:28px;border-radius:50%;
  left:8px;top:4px;
  background:radial-gradient(circle at 36% 30%, #f4f6fa 0%, #c3ccd8 30%, #79818d 68%, #363b43 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -6px 9px rgba(0,0,0,.55),
             0 5px 12px -3px #000;
  border:1px solid #5a626d;
  display:grid;place-items:center;
  transition:left .09s ease-out, top .09s ease-out;
  cursor:grab;
}
#knob.grab{ transition:none; cursor:grabbing; filter:brightness(1.2) }
#knob b{ font-family:var(--disp);font-size:12px;font-weight:800;color:#1a1d22 }
#gearNums{ position:absolute;inset:0;pointer-events:none }
#gearNums span{
  position:absolute;font-family:var(--disp);font-size:9px;font-weight:800;
  color:#5c6570;letter-spacing:.04em;
}
body.pedals-left #shifter{ right:auto; left:calc(env(safe-area-inset-left,0px) + 10px) }
body.pedals-left #tacho{ right:auto; left:calc(env(safe-area-inset-left,0px) + 10px) }
#nitro.hot{background:rgba(95,240,216,.3);color:#eafffb;box-shadow:0 0 26px rgba(95,240,216,.45)}
#nitro:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* ------------ overlay ------------ */
/* Nothing in an overlay may reach past it. The title is set in a display
   face that may or may not have loaded — a fallback with wider metrics used
   to push the word off the side of the screen, and it is invisible on any
   machine where the real font is available. Cap everything and let long words
   break rather than trusting the typeface. */

#veil *{max-width:100%;overflow-wrap:anywhere}
#veil h1{overflow-wrap:break-word;hyphens:auto}
/* ---- A LONG PANEL SCROLLS -----------------------------------------------
   `place-items:center` centres a panel taller than the viewport, which pushes
   BOTH ends off screen — so the last buttons in the garage were unreachable on
   a short phone. It centres while it fits and scrolls when it does not, and the
   bottom padding clears the home indicator.
   ------------------------------------------------------------------------- */
#veil{position:absolute;inset:0;z-index:30;display:grid;place-items:center;
  justify-items:center;align-content:safe center;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:24px 24px calc(env(safe-area-inset-bottom,0px) + 28px);
  /* OPAQUE. A road running behind the menu is motion nobody asked for while
     they are reading stats, and it kept the whole simulation warm for no
     reason. Solid, with a soft vignette so it is not a flat slab. */
  background:radial-gradient(120% 80% at 50% 40%,#1b1424 0%,#0d0912 62%,#07050b 100%);
  text-align:center}
#veil.hidden{display:none}
.vw{width:100%;max-width:330px;margin:auto 0}
.eyebrow{font-size:9px;font-weight:700;letter-spacing:.32em;color:var(--sodium);margin-bottom:12px}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,10.5vw,56px);line-height:.82;
  letter-spacing:-.01em;margin-bottom:14px}
h1 u{text-decoration:none;display:block;font-size:.34em;letter-spacing:.26em;color:var(--sodium);
  margin-top:10px;font-weight:600}
.blurb{font-size:12px;line-height:1.75;color:var(--dim);margin-bottom:22px}
.blurb b{color:var(--pale);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,238,222,.14);
  border:1px solid rgba(255,238,222,.14);margin-bottom:22px}
.gc{background:rgba(10,6,16,.9);padding:10px;text-align:left}
.gc span{display:block;font-size:8px;font-weight:700;letter-spacing:.2em;color:var(--dim);margin-bottom:3px}
.gc b{font-family:var(--disp);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.go{width:100%;padding:15px;font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.26em;
  border:2px solid var(--sodium);color:#fff;background:rgba(255,138,61,.16);cursor:pointer}
.go:active{background:rgba(255,138,61,.34)}
.go:focus-visible{outline:2px solid var(--pale);outline-offset:3px}
.tip{margin-top:16px;font-size:10px;line-height:1.8;color:var(--dim)}
.tip b{color:var(--pale)}

.gwrap{margin:2px auto 10px}
#gcar{display:block;margin:0 auto}
.gname{font-family:var(--disp);font-size:20px;letter-spacing:.10em;color:#fff3e2;margin-top:2px}
.gnote{font-size:9px;letter-spacing:.14em;color:#8a7f92;margin:4px 0 10px}
.gstat{display:flex;justify-content:space-between;align-items:center;
  padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.07);
  font-size:10px;letter-spacing:.12em;color:#9aa0ae}
.gstat b{font-weight:400;color:#fff3e2;font-size:12px}
.bar{display:flex;gap:3px}
.bar i{display:block;width:13px;height:7px;border-radius:2px;background:rgba(255,255,255,.13)}
.bar i.on{background:var(--sodium,#ff8a3d)}
/* ONE ROW, always. Twelve fixed-width circles at any gap will wrap on a
   narrow phone, so they are sized as a FRACTION of the row instead: a grid of
   twelve equal columns that shrinks with the screen rather than spilling. */
/* ---- A SWATCH IS A SWATCH -----------------------------------------------
   `repeat(var(--sw), 1fr)` divided the row by the NUMBER of colours, so the
   cruiser's two filled half the width each — two dinner plates where every
   other car has a row of buttons.

   The track width is fixed to a twelfth of the row instead, and the grid is
   centred. Two swatches are then the same size as twelve, sitting in the
   middle, and nothing has to know how many there are.
   ------------------------------------------------------------------------ */
.swatches{display:grid;
  grid-template-columns:repeat(var(--sw,12), calc((100% - 11*4px)/12));
  justify-content:center;gap:4px;
  align-items:center;margin:12px 0 4px}
.sw{width:100%;aspect-ratio:1;border-radius:50%;
  border:2px solid rgba(255,255,255,.20);cursor:pointer;padding:0;
  min-width:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.gnote{font-size:9px;letter-spacing:.14em;color:var(--sodium,#ffb347);
  padding:6px 0 2px;text-align:center}
.gbox{display:flex;align-items:stretch;margin-top:12px}
.gbox .go{flex:1;border-radius:0;margin:0;border-right-width:0}
.gbox .go:first-child{flex:0 0 46px;border-radius:3px 0 0 3px}
.gbox .go:last-child{flex:0 0 46px;border-radius:0 3px 3px 0;border-right-width:1px}
/* the whole cluster reads as one control: no gaps, shared edges, and the
   DRIVE button closes it off at the bottom */
.gstack{display:flex;flex-direction:column;margin-top:0}
.gstack .go{border-radius:0;margin:0;border-top-width:0}
.gstack .go:last-child{border-radius:0 0 3px 3px}
/* ---- A CONTROL THAT IS SHUT RATHER THAN MISSING (RLG-115) -----------------
   A production or utility car can only go on TEST DRIVE, and the owner's
   answer was that the race modes GREY OUT WITH THE REASON GIVEN rather than
   disappearing. So this has to read as switched off and still legible - a
   control the player can see the shape of, with the `.gnote` under it saying
   which class shut it. `cursor:default` because there is nothing to press.
   ------------------------------------------------------------------------- */
.gstack .go.shut{opacity:.42;filter:grayscale(.65);cursor:default}

/* ---------------------------------------------------------------------------
   PORTRAIT ON A PHONE, WIDE ON A DESKTOP

   The manifest pins the INSTALLED app to portrait, but a browser tab cannot be
   forced — `screen.orientation.lock()` only works from fullscreen and throws
   everywhere else. So: on a touch device held sideways, a panel asks for it
   back. On a desktop there is no such thing as the wrong orientation, and a
   wide window is exactly what we want, so the panel never appears there.

   The test is POINTER TYPE, not width. A landscape phone and a small laptop
   window are the same number of pixels and want opposite things.
   --------------------------------------------------------------------------- */
#rotate{
  position:fixed;inset:0;z-index:9000;display:none;
  place-items:center;text-align:center;padding:28px;
  background:#07050b;color:#e8e2f4;
  font-family:var(--px,ui-monospace,monospace);
}
#rotate b{display:block;font-size:12px;letter-spacing:.22em;color:var(--gold,#e8b23a);margin-bottom:14px}
#rotate span{display:block;font-size:10px;letter-spacing:.14em;color:#8a8296;line-height:2}
#rotate i{display:block;width:52px;height:82px;margin:0 auto 22px;
  border:2px solid rgba(232,178,58,.65);border-radius:8px;
  transform:rotate(90deg);animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,40%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
@media (orientation:landscape) and (pointer:coarse){
  body.lock-portrait #rotate{display:grid}
}

/* the title art sits behind the veil, and only for the title */
#titleArt{position:absolute;inset:0;z-index:29;display:none;width:100%;height:100%}
body.titling #titleArt{display:block}
body.trophying #titleArt{display:block}
body.trophying #veil{
  background:linear-gradient(180deg, rgba(6,4,10,.30) 0%, rgba(6,4,10,.10) 26%,
    rgba(6,4,10,.20) 48%, rgba(6,4,10,.80) 72%, rgba(6,4,10,.96) 100%);
  align-items:end;padding-bottom:30px}
/* with art behind it the veil only needs to darken the lower half for the
   buttons, not cover the picture */
body.titling #veil{
  background:linear-gradient(180deg,
    rgba(8,5,14,0) 0%, rgba(8,5,14,0) 40%,
    rgba(8,5,14,.55) 58%, rgba(8,5,14,.90) 78%, rgba(8,5,14,.96) 100%);
  /* ---- THE TITLE SITS AT THE BOTTOM ------------------------------------
     `align-items` places an item within its ROW; `align-content` places the
     rows. Adding `align-content:safe center` to #veil for the garage overflow
     therefore centred the title menu too, and align-items could not override
     it. The title needs both. */
  align-items:end;align-content:safe end;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
body.titling #veil .vw{margin:0}
body.titling #veil h1{display:none}
/* a bezel line, not a credit: small, dim, and out of the way at the very
   bottom where a cabinet actually carries it */
.legal{margin-top:14px;font-size:8px;letter-spacing:.14em;
  color:rgba(255,255,255,.26);text-align:center}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div>
      <div class="toprow">
        <!-- DISTANCE moved into the speedometer as a mechanical odometer. In
             RACE it comes back, because how far is left is the whole point. -->
        <div class="stat" id="distWrap" hidden><span>TO GO</span><b id="dist">0.0<i>MI</i></b></div>
        <div class="stat c" id="clockWrap"><span>TIME</span><b id="clock">60</b></div>
        <div class="stat c" id="placeWrap" hidden><span>PLACE</span><b id="place">12/12</b></div>
        <div class="stat r"><span>DISTANCE</span><b id="score">0</b></div>
      </div>
    </div>
    <div class="botrow">
      <!-- speed now lives on the dial, where a car keeps it -->
      <div class="bars">
        <!-- The two bars lived down here under the pedals, where the controls
             covered them. Damage is smoke off the bonnet now and nitrous is the
             fill in the bottle, so both read where you are already looking. -->
      </div>
    </div>
  </div>

  <div id="warn"></div>
  <canvas id="wheel" width="230" height="230" aria-label="Steering"></canvas>
  <div id="pedals">
    <button id="nitro" disabled aria-label="Nitrous"><i></i><b>NOS</b></button>
    <button id="gas" aria-label="Accelerator"><i></i></button>
    <button id="brake" aria-label="Brake"><i></i></button>
    <button id="horn" aria-label="Horn"><i></i></button>
  </div>
  <div id="dials">
    <canvas id="gauges" width="230" height="118"></canvas>
  </div>
  <div id="shifter" hidden>
    <div id="gate"></div>
    <div id="knob" data-gear="1"><b>1</b></div>
  </div>
  <!-- a formula car does not have a gate: two paddles and a number -->
  <!-- no gear number between them: the tacho already shows the gear, and a
       formula wheel has paddles, not a readout -->
  <div id="paddles" hidden>
    <button id="padDown" type="button">−</button>
    <button id="padUp" type="button">+</button>
  </div>
  <canvas id="titleArt"></canvas>
<div id="veil"><div class="vw" id="veilBody"></div></div>
</div></div>

<script>
/* ---- MOTORSPORT --------------------------------------------------------------
   Everything this game shares with Interstate is in road.js. What is left here is
   only what makes it a CIRCUIT racer: a finite road that wraps, lap counting,
   and the minimap. 300 lines against the engine's 8,400.

   The engine is handed five callbacks and asks for them at its own seams. It
   has no idea what a lap is.
   --------------------------------------------------------------------------- */
let circuit = null, lap = 0, lapsTotal = 5, lapStart = 0,
    bestLap = 0, lastLap = 0, league = 'cup';
/* ---- THE ENGINE HANDS ITSELF IN ---------------------------------------
   Capturing the RETURN value is too late: `onReset` fires during setup, before
   ROAD() has returned anything. The engine writes its surface onto the config
   object as `CFG.api` on its first line, so this object is live from the
   moment the first seam runs. */
/* no civilian traffic, no police, no roadblocks, no crates — a circuit is
   not a highway */
const CFG = { id:'motorsport', title:'Redline Motorsport', circuitOnly:true,
  /* ---- A CIRCUIT GARAGE HOLDS ONLY WHAT CAN RACE (RLG-115) ---------------
     Owner, 2026-09-05: production and utility vehicles are "not offered at
     all in Motorsport". Interstate lists them and greys the race modes out,
     because it HAS a mode they are legal in - TEST DRIVE. A circuit does not,
     so listing a van here would offer a car with nothing it could do.

     THIS IS THE FIRST TIME THE TWO GAMES' GARAGES DIFFER, and that is worth
     saying out loud: REDLINE is one engine and one fleet, and this cuts
     across it. It is a `CFG` flag for exactly that reason - the engine reads
     a setting and never asks which game it is.
     -------------------------------------------------------------------- */
  raceOnlyGarage:true };
const R = new Proxy({}, { get: (_, k) => CFG.api && CFG.api[k] });

/* ===========================================================================
   FUEL, TYRES AND THE PIT LANE

   Damage punishes contact. Fuel and tyres are a DECISION you make before the
   race and live with — a better game, and the whole reason a circuit needs a
   pit lane.

     FUEL   burns with the THROTTLE, not with time, so a lap at full noise
            costs more than a lap spent braking
     TYRES  wear with LATERAL load, so corners eat them and straights do not.
            As they go, grip falls and the same corner needs more braking
            every lap — which is the pressure that makes a stop a decision
     PIT    the last 9% of the lap. Under 60mph the crew works: fuel in at a
            fixed rate, tyres back to new. The time lost is the price.

   Declared with `var`, deliberately: `hudScore` is called during ROAD()'s
   setup, before this file finishes executing, so a `const` here is still in
   its temporal dead zone and the whole game throws.
   =========================================================================== */
var COMPOUNDS = {
  SOFT:   { grip:1.10, wear:1.70, name:'SOFT'   },
  MEDIUM: { grip:1.00, wear:1.00, name:'MEDIUM' },
  HARD:   { grip:0.92, wear:0.62, name:'HARD'   }
};
var compound = 'MEDIUM';
var circuitBiome = 'FOREST';
var titleTrack = null;

/* ===========================================================================
   SECTORS AND THE DELTA

   A lap time tells you how you did after it is over. A DELTA tells you how you
   are doing NOW, which is the entire hook of a time trial: "+0.31" against
   your best is a reason to take the next corner differently.

   The lap is cut in three at a third and two thirds of the distance — real
   circuits place sector lines by feel, but by distance is honest and needs no
   authoring. For each sector we keep the best time ever set on this circuit,
   and while you are in one the HUD shows how far up or down you are on it.

   Colouring follows the convention every timing screen uses, because it is
   read at a glance and nobody has to be taught it:

       PURPLE   the best that sector has ever been
       GREEN    better than your own best
       YELLOW   worse

   All of it is arithmetic on numbers the game already had.
   =========================================================================== */
var SECTORS = 3;
var secBest = [0, 0, 0];       /* the best each sector has been */
var secThis = [0, 0, 0];       /* this lap's, as they complete */
var secIdx  = 0;               /* which sector we are in */
var secStart = 0;              /* clock when this sector began */
var secDelta = 0;              /* live, against secBest[secIdx] */
var secColour = '';            /* purple / green / yellow, last completed */

function sectorOf(z){
  if(!circuit) return 0;
  const f = trackZ(z) / circuit.len;
  return f < 1/3 ? 0 : f < 2/3 ? 1 : 2;
}

function resetSectors(hard){
  secIdx = sectorOf(R.pos + R.PLAYER_Z);
  secStart = R.clock;
  secThis = [0,0,0];
  secDelta = 0; secColour = '';
  if(hard) secBest = [0,0,0];
}

function stepSectors(){
  if(!circuit || R.state !== 'driving') return;
  const now = sectorOf(R.pos + R.PLAYER_Z);

  /* live delta: how long have we been in this sector against the best */
  const elapsed = secStart - R.clock;
  secDelta = secBest[secIdx] ? (elapsed - secBest[secIdx]) : 0;

  if(now !== secIdx){
    const t = secStart - R.clock;
    /* a sector time only counts if we entered it properly — a lap that
       started mid-sector would otherwise record a fragment as a record */
    if(t > 0.5){
      secThis[secIdx] = t;
      if(!secBest[secIdx] || t < secBest[secIdx]){
        secBest[secIdx] = t;
        secColour = 'purple';
      } else {
        secColour = t < secBest[secIdx] * 1.01 ? 'green' : 'yellow';
      }
      R.snd.tick ? null : null;
    }
    secIdx = now;
    secStart = R.clock;
    secDelta = 0;
  }
}

function fmtDelta(d){
  if(!d) return '';
  const sign = d >= 0 ? '+' : '\u2212';
  return sign + Math.abs(d).toFixed(2);
}

/* ===========================================================================
   QUALIFYING

   The title screen shows a grid. The game did not have one — you were simply
   dropped into a race in whatever position the field happened to leave you.

   Qualifying is one flying lap on an empty circuit. The time you set decides
   where you start, and that is the whole rule. It reuses the lap timer that
   already exists; what is new is only the comparison against the field and
   the screen that reports it.

   The rivals do not drive their own laps — they are given times drawn around
   yours, weighted by their class pace, which is both cheaper and more
   controllable than simulating eleven cars for a minute.
   =========================================================================== */
var qualifying = false;      /* are we ON the qualifying lap right now */
var qualDone   = false;      /* has a time been set for this circuit */
var qualTime   = 0;          /* yours, in seconds */
var qualGrid   = 0;          /* the slot it earned, 1 = pole */
var qualField  = [];         /* every time, sorted, for the report */

function startQualifying(){
  qualifying = true; qualDone = false;
  qualTime = 0; qualGrid = 0; qualField.length = 0;
  R.flashWarn('QUALIFYING \u00B7 ONE LAP');
}

/* the field's times, drawn around yours */
function buildQualField(mine){
  const n = 11;
  const out = [{ you:true, t:mine }];
  for(let i = 0; i < n; i++){
    /* a spread of +-4% around your time, biased slightly slower so a clean
       lap is rewarded and a scruffy one is punished */
    const f = 1 + R.rnd(-0.038, 0.052);
    out.push({ you:false, t: mine * f, num: i + 1 });
  }
  out.sort((a, b) => a.t - b.t);
  return out;
}

function finishQualifying(){
  qualifying = false; qualDone = true;
  qualTime = lastLap || (lapStart - R.clock);
  qualField = buildQualField(qualTime);
  qualGrid  = qualField.findIndex(q => q.you) + 1;
  R.snd.checkpoint();
  R.flashWarn(qualGrid === 1 ? 'POLE POSITION' : 'P' + qualGrid + ' ON THE GRID');
}

function fmtLap(t){
  if(!t || t < 0) return '--.---';
  const m = Math.floor(t / 60), s2 = t - m*60;
  return m > 0 ? (m + ':' + (s2 < 10 ? '0' : '') + s2.toFixed(3))
               : s2.toFixed(3);
}

/* ---- THE SCALE CONSTANT ---------------------------------------------------
   `k = turn / (len * K)`, so K converts geometry into the curvature the
   driving code feels. At Interstate's 0.00028 a corner tight enough to slow a
   formula car had a radius of ~320 units — crossed in 0.07 seconds, far too
   short to brake for, so the car was flung off rather than slowed.

   The radius and the duration could not both be satisfied at that scale. K
   decides the trade: a SMALLER K makes a given radius bite harder, so the
   corner can be physically large enough to last.

       K          R=4000    k      cap      time in corner
       0.00028     —       0.9    218mph   0.9s   — not a corner
       0.000030    —       8.3    110mph   1.49s
       0.000022    —      11.4     94mph   1.74s   ← this one
       0.000016    —      15.6     80mph   2.05s

   A hairpin at 94mph that takes nearly two seconds is a corner you brake for
   and drive through. Interstate is untouched — this constant is Motorsport's.
   -------------------------------------------------------------------------- */
var CURVE_K = 0.000040;
var fuel = 100, tyre = 100, inPit = false, pitTime = 0, stops = 0;
var PIT_SPEED = 60 / 200;

function inPitLane(z){
  if(!circuit) return false;
  return (trackZ(z) / circuit.len) > 0.91;
}

function stepPit(dt){
  if(!circuit || R.state !== 'driving') return;
  dt = dt || 1/60;
  /* ---- FUEL IS THROTTLE x RPM ----------------------------------------
     Burn was a function of SPEED, which is wrong: an engine drinks by how
     hard it is working and how fast it is spinning, not by how far along the
     road it happens to be. A car held at the limiter in second burns far
     more than the same car loafing at the same speed in sixth — and that is
     the whole reason a driver short-shifts to save fuel.

         burn = idle + throttle x revFrac^1.35
     ------------------------------------------------------------------- */
  const throttle = R.throttle();
  const revFrac  = Math.min(1.15, R.revs() / Math.max(1, R.redline()));
  const burn = 0.30 + throttle * Math.pow(revFrac, 1.35) * 2.15;
  /* ---- A TANK HAS TO LAST A STINT --------------------------------------
     Measured: empty in 54 seconds, which is less than ONE lap of a 64-88
     second circuit. A race is five laps, so the tank has to cover two or
     three of them and make a stop a decision rather than a certainty.

     0.55 was tuned before the corner fix tripled lap times. 0.135 gives
     roughly three and a half laps of hard driving — enough that a one-stop
     works and a no-stop is a gamble.
     ------------------------------------------------------------------- */
  fuel = Math.max(0, fuel - dt * burn * 0.135);

  const k = Math.abs(R.segAt(circuit.segs, trackZ(R.pos + R.PLAYER_Z)));
  const v = R.spd / R.MAX_SPD;
  /* ---- TWO STINTS, NOT ONE ---------------------------------------------
     I claimed 0.42 gave "about two and a half laps". Measured properly it
     gives **10 to 14**, which is longer than any race — so tyres were
     decoration and only fuel decided anything. The claim was derived from a
     ratio I never checked against a real lap time.

     1.9 was then set to give a MEDIUM three laps of five. Measured at
     RACING pace by tools/drive-test.py it gives 485% of a tyre per lap — the
     set is gone a fifth of the way round lap one.

     Both wrong numbers have the same cause: wear is `k · v²`, so it is four
     times higher at 190mph than at 95, and any figure taken from a lap spent
     grinding a barrier at 55mph understates it by an order of magnitude. The
     old 0.42 "10 to 14 laps" was measured on exactly such a lap.

     0.155 is set from a clean 36-second lap at 190mph: MEDIUM loses about
     40% a lap, so a set is good for two and a half. SOFT (×1.70) forces a
     second stop, HARD (×0.62) makes one comfortable and costs pace once
     COMPOUNDS.grip is finally wired into cornerG. Re-measure with
     `python3 tools/drive-test.py motorsport` after any change to pace.
     ------------------------------------------------------------------- */
  tyre = Math.max(0, tyre - dt * (k * v * v) * 0.155 * COMPOUNDS[compound].wear);

  const wasIn = inPit;
  inPit = inPitLane(R.pos + R.PLAYER_Z);
  if(inPit && !wasIn) R.flashWarn('PIT LANE');
  /* ---- THE BOX ---------------------------------------------------------
     Servicing used to happen TO you: park slowly and two numbers refilled
     themselves at a fixed rate. The crew is the player now — see THE PIT
     STOP below. Coming to a stop in the box hands over to it, and the only
     thing this function still owns is deciding when that happens. */
  if(inPit) pitTime += dt;
  if(inPit && inPitBox(R.pos + R.PLAYER_Z) &&
     R.spd < R.MAX_SPD * PIT_SPEED * 0.34 && !PIT.on && PIT.released <= 0){
    pitEnter();
  }
  if(PIT.released > 0) PIT.released = Math.max(0, PIT.released - dt);
  stepPitStop(dt);
}



/* ===========================================================================
   THE PIT STOP — A JOB, NOT A WAIT

   The stop used to be a toll: park under 60mph and stand still while two
   numbers refilled themselves. It cost time and asked nothing, which made the
   only real decision (WHEN to come in) the only interesting thing about it.

   Now the crew is YOU, and the clock is running:

     FUEL   drag the hose down onto the cap. It latches and fuel starts
            flowing. It keeps flowing until you drag it off — so leaving
            early with a part tank is a choice you are allowed to make.
     LUGS   tap each of the five. One zzt of the wrench per tap and it spins
            off. Five off before the wheel will move.
     WHEEL  press and HOLD to haul the old one off, hold again to seat the
            new one. Let go early and it drops back.
     LUGS   tap them back on, five more zzts.

   Released when the wheel is bolted up AND the hose is clear — a car does not
   leave its box with the fuel rig still attached, and the game should not let
   you either.

   Everything is drawn into the same canvas through `afterDraw`, and every
   touch is read off `#cv` with a capturing listener that stops the driving
   controls from seeing it. No new DOM, no new files.
   =========================================================================== */
var PIT = {
  on:false, t:0, best:0, shown:0, shownCol:'', released:0,
  hose:'stowed',          /* stowed | dragging | latched */
  hoseY:0, hoseX:0,
  lugs:[1,1,1,1,1],       /* 1 = on the wheel */
  wheel:'on',             /* on | off | new */
  hold:0, holdOn:false,
  phase:'',               /* the line of text under the clock */
  litUntil:0
};

var PIT_LUG_N = 5;
/* `AR` is road.js's own alias and lives inside its closure — this file cannot
   see it, and reaching for it threw "AR is not defined" before the page had
   drawn a single frame. Read the shell off `window` here, lazily, because
   arcade.js may not have run when this line does. */
function pitAR(){ return window.Arcade || null; }
(function(){ const A = pitAR(); const sv = A && A.save ? A.save.get('motorsport') : null;
             if(sv && sv.bestPit) PIT.best = sv.bestPit; })();

function pitReset(){
  PIT.on = false; PIT.t = 0; PIT.hose = 'stowed'; PIT.hoseY = 0;
  PIT.lugs = [1,1,1,1,1]; PIT.wheel = 'on'; PIT.hold = 0; PIT.holdOn = false;
  PIT.phase = ''; PIT.released = 0;
}

/* the pit BOX is the far end of the pit lane — you have to travel its length
   before the crew will take you, so entering at the last moment is not free */
function inPitBox(z){
  if(!circuit) return false;
  const f = trackZ(z) / circuit.len;
  return f > 0.945;
}

/* ---- the air wrench -------------------------------------------------------
   A rattle gun is not a tone, it is a burst of hammer blows: a short band of
   noise chopped into six impacts with the pitch climbing as the nut frees off.
   Built from A.sfx.noise so it rides the sfx bus, obeys the mute, and stops
   with the game like everything else. */
function zzt(up){
  const A = pitAR(); if(!A || !A.sfx) return;
  const t0 = (A.audio && A.audio.ctx) ? A.audio.ctx.currentTime : 0;
  for(let i = 0; i < 6; i++){
    A.sfx.noise({
      t: t0 + i * 0.032, dur: 0.028, gain: 0.13 - i * 0.008,
      freq: (up ? 1500 : 2400) + i * (up ? 190 : -150),
      q: 5.5, filter: 'bandpass'
    });
  }
  A.sfx.tone({ t: t0, dur: 0.20, type: 'square', freq: up ? 150 : 190,
                to: up ? 210 : 120, gain: 0.045, cutoff: 900 });
}
function pitClunk(){
  const A = pitAR(); if(!A || !A.sfx) return;
  A.sfx.noise({ dur: 0.13, gain: 0.16, freq: 220, to: 90, q: 1.1 });
  A.sfx.tone({ dur: 0.10, type: 'sine', freq: 90, to: 55, gain: 0.10 });
}
function pitLatch(){
  const A = pitAR(); if(!A || !A.sfx) return;
  A.sfx.tone({ dur: 0.09, type: 'square', freq: 520, to: 700, gain: 0.07, cutoff: 1800 });
}

function pitDone(){
  return PIT.wheel === 'new' && PIT.lugs.every(v => v === 1) && PIT.hose === 'stowed';
}

/* ---- the readout ----------------------------------------------------------
   Same convention as the sectors, because it is read at a glance and nobody
   should have to learn a second one: purple for a new best, green for within
   a hair of it, yellow for slower. */
function pitColour(t){
  if(!PIT.best || t < PIT.best) return 'purple';
  return t < PIT.best * 1.08 ? 'green' : 'yellow';
}
var PIT_COL = { purple:'#b96bff', green:'#4dd6a0', yellow:'#e9e6a8' };

function stepPitStop(dt){
  /* leaving the box with the job unfinished is allowed — you just leave with
     whatever you took on */
  if(PIT.on && !inPitBox(R.pos + R.PLAYER_Z)) pitRelease(true);
  if(!PIT.on) return;
  PIT.t += dt;
  R.setSpd(0);                       /* the car is stopped and stays stopped */

  if(PIT.hose === 'latched'){
    fuel = Math.min(100, fuel + dt * 21);
    /* only nag about the hose once the WHEEL is done — this line ran every
       frame and stamped over 'HOLD TO FIT THE NEW ONE', so the crew was told
       to pull the hose while still holding a tyre in both hands */
    if(fuel >= 100 && PIT.wheel === 'new' && PIT.lugs.every(v => v === 1))
      PIT.phase = 'TANK FULL \u2014 PULL THE HOSE';
  }
  if(PIT.holdOn){
    PIT.hold += dt;
    const need = 0.65;
    if(PIT.hold >= need){
      PIT.hold = 0; PIT.holdOn = false;
      if(PIT.wheel === 'on'){ PIT.wheel = 'off'; pitClunk(); PIT.phase = 'HOLD TO FIT THE NEW ONE'; }
      else if(PIT.wheel === 'off'){ PIT.wheel = 'new'; tyre = 100; pitClunk();
                                    PIT.phase = 'BOLT IT BACK ON'; }
    }
  } else if(PIT.hold > 0){
    PIT.hold = Math.max(0, PIT.hold - dt * 2.2);   /* let go and it slips back */
  }

  if(pitDone()) pitRelease(false);
}

/* the driving furniture — HUD, wheel, pedals, dials — is DOM sitting on top
   of the canvas, so it stayed lit over the pit view and the lap readout ran
   straight through the pit clock. Hide it for the duration; the box is a
   different screen, not an overlay on the same one. */
function pitChrome(hide){
  document.body.classList.toggle('in-pit', !!hide);
}

function pitEnter(){
  if(PIT.on || PIT.released > 0) return;
  PIT.on = true; PIT.t = 0;
  pitChrome(true);
  PIT.hose = 'stowed'; PIT.lugs = [1,1,1,1,1]; PIT.wheel = 'on';
  PIT.hold = 0; PIT.holdOn = false;
  PIT.phase = 'DROP THE HOSE \u00b7 CRACK THE LUGS';
  R.setSpd(0);
  R.flashWarn('PIT BOX');
}

function pitRelease(bailed){
  if(!PIT.on) return;
  PIT.on = false;
  pitChrome(false);
  stops++;
  const t = PIT.t;
  PIT.shown = t;
  PIT.shownCol = bailed ? 'yellow' : pitColour(t);
  if(!bailed && (!PIT.best || t < PIT.best)){
    PIT.best = t;
    const A2 = pitAR(); if(A2 && A2.save) A2.save.merge('motorsport', { bestPit:+t.toFixed(2) });
  }
  PIT.released = 4.2;                /* how long the readout stays up */
  R.snd.checkpoint();
  R.flashWarn(bailed ? 'PIT EXIT' : 'GO GO GO');
}

/* ---- input ----------------------------------------------------------------
   Capturing, on the canvas, and it stops propagation while the stop is live so
   the steering wheel and pedals underneath never see the touch. */
function pitPoint(e){
  const r = cvEl().getBoundingClientRect();
  return { x: (e.clientX - r.left), y: (e.clientY - r.top), w: r.width, h: r.height };
}
function cvEl(){ return document.getElementById('cv'); }

function pitLayout(w, h){
  /* one wheel, big, right of centre; the hose comes down the left */
  const cx = w * 0.62, cy = h * 0.56, R0 = Math.min(w * 0.30, h * 0.20);
  return {
    cx, cy, R0,
    capX: w * 0.20, capY: h * 0.42, capR: Math.max(20, R0 * 0.28),
    hoseHomeX: w * 0.20, hoseHomeY: h * 0.13
  };
}
function pitLugPos(L, i){
  const a = -Math.PI / 2 + i * (Math.PI * 2 / PIT_LUG_N);
  return { x: L.cx + Math.cos(a) * L.R0 * 0.52, y: L.cy + Math.sin(a) * L.R0 * 0.52 };
}

function pitDown(e){
  if(!PIT.on) return;
  e.preventDefault(); e.stopPropagation();
  const p = pitPoint(e), L = pitLayout(p.w, p.h);

  /* the hose: grab it anywhere along its nozzle */
  const nz = PIT.hose === 'latched' ? { x:L.capX, y:L.capY }
                                    : { x:L.hoseHomeX, y:L.hoseHomeY + PIT.hoseY };
  if(Math.hypot(p.x - nz.x, p.y - nz.y) < L.capR * 1.3){
    PIT.hose = 'dragging'; PIT.hoseX = p.x; PIT.hoseY = p.y - L.hoseHomeY;
    return;
  }
  /* the lugs */
  for(let i = 0; i < PIT_LUG_N; i++){
    const g = pitLugPos(L, i);
    if(Math.hypot(p.x - g.x, p.y - g.y) < L.R0 * 0.20){
      if(PIT.lugs[i] === 1 && PIT.wheel === 'on'){
        PIT.lugs[i] = 0; zzt(false); PIT.litUntil = PIT.t + 0.18;
        if(PIT.lugs.every(v => v === 0)) PIT.phase = 'HOLD THE WHEEL TO PULL IT';
        return;
      }
      if(PIT.lugs[i] === 0 && PIT.wheel === 'new'){
        PIT.lugs[i] = 1; zzt(true); PIT.litUntil = PIT.t + 0.18;
        if(PIT.lugs.every(v => v === 1)) PIT.phase = 'CLEAR THE HOSE';
        return;
      }
      return;
    }
  }
  /* the wheel itself: press and hold */
  if(Math.hypot(p.x - L.cx, p.y - L.cy) < L.R0 &&
     PIT.lugs.every(v => v === 0) && PIT.wheel !== 'new'){
    PIT.holdOn = true;
  }
}

function pitMove(e){
  if(!PIT.on || PIT.hose !== 'dragging') return;
  e.preventDefault(); e.stopPropagation();
  const p = pitPoint(e), L = pitLayout(p.w, p.h);
  PIT.hoseX = p.x; PIT.hoseY = p.y - L.hoseHomeY;
}

function pitUp(e){
  if(!PIT.on) return;
  PIT.holdOn = false;
  if(PIT.hose === 'dragging'){
    e.preventDefault(); e.stopPropagation();
    const p = pitPoint(e), L = pitLayout(p.w, p.h);
    if(Math.hypot(p.x - L.capX, p.y - L.capY) < L.capR * 1.5){
      PIT.hose = 'latched'; pitLatch(); PIT.phase = 'FUELLING \u00b7 CRACK THE LUGS';
    } else {
      PIT.hose = 'stowed'; PIT.hoseY = 0;
      PIT.phase = PIT.wheel === 'new' && PIT.lugs.every(v => v === 1)
                ? '' : 'HOSE CLEAR \u2014 FINISH THE WHEEL';
    }
  }
}

(function pitBind(){
  const bind = () => {
    const cv = cvEl();
    if(!cv) return setTimeout(bind, 60);
    /* bound on WINDOW, not the canvas: capture on window runs before the
       event reaches any element, so an overlay drifting over the canvas can
       never intercept the crew's taps. Coordinates still come off the canvas
       rect, so the drawing and the hit tests share one space. */
    window.addEventListener('pointerdown', pitDown, { capture:true, passive:false });
    window.addEventListener('pointermove', pitMove, { capture:true, passive:false });
    window.addEventListener('pointerup', pitUp,  { capture:true, passive:false });
    window.addEventListener('pointercancel', pitUp, { capture:true, passive:false });
  };
  bind();
})();

/* ---- the view -------------------------------------------------------------
   Drawn over the frozen road: a dark wash, the crew's-eye view of one corner
   of the car, and the clock. */
function drawPitView(g){
  const cv = cvEl(), r = cv.getBoundingClientRect();
  const w = r.width, h = r.height, L = pitLayout(w, h);

  g.save();
  /* opaque, not a 90% wash: the wash left the rear-view mirror showing
     through as a ghost strip of road above the garage */
  g.fillStyle = '#06090e'; g.fillRect(0, 0, w, h);

  /* the garage floor and the box markings */
  g.fillStyle = '#12161d'; g.fillRect(0, h * 0.30, w, h * 0.70);
  g.strokeStyle = 'rgba(233,230,168,0.45)'; g.lineWidth = 3;
  g.strokeRect(w * 0.06, h * 0.34, w * 0.88, h * 0.56);
  for(let i = 0; i < 8; i++){
    g.fillStyle = i % 2 ? '#e9e6a8' : '#1b2028';
    g.fillRect(w * 0.06 + i * (w * 0.88 / 8), h * 0.325, w * 0.88 / 8, 5);
  }

  /* ---- the clock ---- */
  g.textAlign = 'center';
  g.fillStyle = '#f4f7fb';
  g.font = '700 ' + Math.round(h * 0.075) + 'px ui-monospace, Menlo, monospace';
  g.fillText(PIT.t.toFixed(2), w * 0.5, h * 0.16);
  g.font = '600 ' + Math.round(h * 0.020) + 'px system-ui, sans-serif';
  g.fillStyle = 'rgba(174,188,207,0.9)';
  g.fillText('PIT STOP' + (PIT.best ? '   BEST ' + PIT.best.toFixed(2) : ''), w * 0.5, h * 0.20);
  if(PIT.phase){
    g.fillStyle = '#e9e6a8';
    g.font = '700 ' + Math.round(h * 0.022) + 'px system-ui, sans-serif';
    g.fillText(PIT.phase, w * 0.5, h * 0.26);
  }

  /* ---- fuel: the cap, and the hose ---- */
  g.save();
  g.translate(L.capX, L.capY);
  g.fillStyle = '#242c38'; g.beginPath(); g.arc(0, 0, L.capR * 1.25, 0, 6.2832); g.fill();
  g.fillStyle = PIT.hose === 'latched' ? '#4dd6a0' : '#3a4657';
  g.beginPath(); g.arc(0, 0, L.capR, 0, 6.2832); g.fill();
  g.strokeStyle = '#0b0e0c'; g.lineWidth = 2;
  for(let i = 0; i < 6; i++){
    const a = i * Math.PI / 3;
    g.beginPath(); g.moveTo(Math.cos(a) * L.capR * 0.45, Math.sin(a) * L.capR * 0.45);
    g.lineTo(Math.cos(a) * L.capR * 0.92, Math.sin(a) * L.capR * 0.92); g.stroke();
  }
  g.restore();

  const nz = PIT.hose === 'latched' ? { x:L.capX, y:L.capY }
           : PIT.hose === 'dragging' ? { x:PIT.hoseX, y:L.hoseHomeY + PIT.hoseY }
           : { x:L.hoseHomeX, y:L.hoseHomeY };
  g.strokeStyle = '#2b3442'; g.lineWidth = Math.max(9, L.capR * 0.55);
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(L.hoseHomeX, 0);
  g.quadraticCurveTo(L.hoseHomeX - w * 0.10, (nz.y) * 0.55, nz.x, nz.y);
  g.stroke();
  g.fillStyle = PIT.hose === 'latched' ? '#4dd6a0' : '#8b97a8';
  g.beginPath(); g.arc(nz.x, nz.y, L.capR * 0.62, 0, 6.2832); g.fill();

  /* fuel bar */
  const bw = w * 0.26, bx = L.capX - bw / 2, by = L.capY + L.capR * 2.1;
  g.fillStyle = '#0b0e0c'; g.fillRect(bx, by, bw, 12);
  g.fillStyle = fuel > 30 ? '#4dd6a0' : '#e0332f';
  g.fillRect(bx, by, bw * (fuel / 100), 12);
  g.fillStyle = 'rgba(174,188,207,0.9)';
  g.font = '600 ' + Math.round(h * 0.016) + 'px system-ui, sans-serif';
  g.fillText('FUEL ' + Math.round(fuel) + '%', L.capX, by + 30);

  /* ---- the wheel ---- */
  g.save();
  g.translate(L.cx, L.cy);
  if(PIT.wheel === 'off'){
    /* the bare hub, waiting */
    g.fillStyle = '#1b2028'; g.beginPath(); g.arc(0, 0, L.R0 * 0.62, 0, 6.2832); g.fill();
    g.strokeStyle = '#3a4657'; g.lineWidth = 4; g.stroke();
  } else {
    const worn = PIT.wheel === 'new' ? 100 : tyre;
    g.fillStyle = '#0d1014';
    g.beginPath(); g.arc(0, 0, L.R0, 0, 6.2832); g.fill();
    /* tread blocks thin out as the tyre goes off */
    g.strokeStyle = worn > 35 ? '#2a3240' : '#4a2626';
    g.lineWidth = Math.max(2, L.R0 * 0.05);
    const blocks = 18;
    for(let i = 0; i < blocks; i++){
      const a = i * 6.2832 / blocks;
      g.beginPath();
      g.moveTo(Math.cos(a) * L.R0 * 0.86, Math.sin(a) * L.R0 * 0.86);
      g.lineTo(Math.cos(a) * L.R0 * 0.99, Math.sin(a) * L.R0 * 0.99);
      g.stroke();
    }
    g.fillStyle = '#8b97a8';
    g.beginPath(); g.arc(0, 0, L.R0 * 0.62, 0, 6.2832); g.fill();
    g.fillStyle = '#5a6675';
    g.beginPath(); g.arc(0, 0, L.R0 * 0.22, 0, 6.2832); g.fill();
    /* compound band, so the new set reads as a decision you made */
    g.strokeStyle = compound === 'SOFT' ? '#e0332f'
                  : compound === 'HARD' ? '#f4f7fb' : '#e9e6a8';
    g.lineWidth = Math.max(3, L.R0 * 0.06);
    g.beginPath(); g.arc(0, 0, L.R0 * 0.74, 0, 6.2832); g.stroke();
  }
  g.restore();

  /* the lugs */
  for(let i = 0; i < PIT_LUG_N; i++){
    const p = pitLugPos(L, i), on = PIT.lugs[i] === 1;
    const live = (on && PIT.wheel === 'on') || (!on && PIT.wheel === 'new');
    g.save(); g.translate(p.x, p.y);
    if(!on && PIT.wheel !== 'new'){ g.globalAlpha = 0.16; }
    g.fillStyle = on ? '#cdd6e2' : '#2a3240';
    g.beginPath();
    for(let k = 0; k < 6; k++){
      const a = k * Math.PI / 3 + 0.4;
      const rr = L.R0 * 0.115;
      k ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr)
        : g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath(); g.fill();
    if(live){
      g.strokeStyle = PIT.t < PIT.litUntil ? '#4dd6a0' : 'rgba(233,230,168,0.8)';
      g.lineWidth = 2.5; g.stroke();
    }
    g.restore();
  }

  /* the hold ring, while hauling a wheel */
  if(PIT.hold > 0){
    g.strokeStyle = '#4dd6a0'; g.lineWidth = 6;
    g.beginPath();
    g.arc(L.cx, L.cy, L.R0 * 1.14, -Math.PI / 2,
          -Math.PI / 2 + 6.2832 * Math.min(1, PIT.hold / 0.65));
    g.stroke();
  }
  g.restore();
}

/* the readout that follows you out of the box */
function drawPitTime(g){
  const cv = cvEl(), r = cv.getBoundingClientRect(), w = r.width, h = r.height;
  const a = Math.min(1, PIT.released / 0.6);
  g.save();
  g.globalAlpha = a;
  g.textAlign = 'center';
  g.fillStyle = 'rgba(6,9,14,0.72)';
  g.fillRect(w * 0.20, h * 0.30, w * 0.60, h * 0.13);
  g.fillStyle = PIT_COL[PIT.shownCol] || '#f4f7fb';
  g.font = '700 ' + Math.round(h * 0.058) + 'px ui-monospace, Menlo, monospace';
  g.fillText(PIT.shown.toFixed(2), w * 0.5, h * 0.385);
  g.fillStyle = 'rgba(174,188,207,0.95)';
  g.font = '600 ' + Math.round(h * 0.018) + 'px system-ui, sans-serif';
  g.fillText(PIT.shownCol === 'purple' ? 'BEST PIT STOP' : 'PIT STOP', w * 0.5, h * 0.335);
  g.restore();
}


/* ===========================================================================
   THE CIRCUIT

   Interstate's road is INFINITE: `pushCurve` adds segments at the front and old
   ones are shifted off the back. A circuit is the same generator with one
   difference — it is FINITE and it wraps. Build N segments once, then answer
   "what is the curvature at z" with `z % trackLength`.

   Everything downstream keeps working untouched, because nothing else asks
   how long the road is: `curvatureAt`, the bend integration, the skyline
   parallax and the hills all just want a number for a given z.

   A lap is therefore `pos / trackLength`, and that is the whole system.
   =========================================================================== */

/* ---- A CIRCUIT HAS TO BE A REAL SHAPE ------------------------------------
   The first generator strung a straight and a turn together N times and hoped.
   It made spikes, hairpin chains and tracks that crossed themselves four
   times \u2014 then FORCED them closed by spreading the error over every corner,
   which quietly bent every turn away from what it had chosen.

   Generate and TEST instead. A candidate is kept only if it is a shape a
   circuit could be:

     1. it turns through 360 degrees, ONCE     a lap goes round, not to and fro
     2. it returns to its start                within 8% of the track's size
     3. it does not cross itself               we have no bridge
     4. it is not a splinter                   aspect ratio under 2.6:1

   Up to 400 candidates; the best-scoring is kept even if none passes
   outright, so it always returns a track and usually a good one.
   ------------------------------------------------------------------------- */
function circuitShape(segs){
  const STEP = 300;
  const pts = [];
  let ang = 0, x = 0, y = 0, z = 0, len = 0;
  for(const g of segs) len += g.len;
  while(z < len){
    ang += R.segAt(segs, z) * CURVE_K * STEP;
    x += Math.sin(ang) * STEP;
    y += Math.cos(ang) * STEP;
    pts.push([x, y]);
    z += STEP;
  }
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const q of pts){ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0];
                       if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; }
  const w = Math.max(1,x1-x0), h = Math.max(1,y1-y0), size = Math.max(w,h);
  const gap = Math.hypot(pts[pts.length-1][0], pts[pts.length-1][1]) / size;
  return { pts, ang, w, h, size, gap, len };
}

function crossings(pts){
  const hit = (a,b,c,d) => {
    const s1x=b[0]-a[0], s1y=b[1]-a[1], s2x=d[0]-c[0], s2y=d[1]-c[1];
    const den = (-s2x*s1y + s1x*s2y);
    if(Math.abs(den) < 1e-9) return false;
    const s = (-s1y*(a[0]-c[0]) + s1x*(a[1]-c[1])) / den;
    const t = ( s2x*(a[1]-c[1]) - s2y*(a[0]-c[0])) / den;
    return s > 0.02 && s < 0.98 && t > 0.02 && t < 0.98;
  };
  /* ---- THE CLOSING CHORD IS PART OF THE TRACK ------------------------
     The map calls `closePath()`, which draws a straight line from the last
     point back to the first. If the lap does not land exactly on its start,
     that chord cuts clean across the circuit — and it was never tested,
     because the loop stopped at `pts.length - S`.

     Those thin straight lines slicing through the tracks WERE the chord. The
     count said zero because the one segment doing the crossing was the one
     segment nobody looked at.

     It is included now, so a track that does not truly close is scored as the
     mess it will be drawn as, and the search rejects it.
     ------------------------------------------------------------------ */
  let n = 0;
  const S = 3;
  const segsOf = [];
  for(let i = 0; i + S < pts.length; i += S) segsOf.push([pts[i], pts[i+S]]);
  segsOf.push([pts[pts.length-1], pts[0]]);          /* the closing chord */
  for(let i = 0; i < segsOf.length; i++)
    for(let j = i + 2; j < segsOf.length; j++){
      if(i === 0 && j === segsOf.length - 1) continue;   /* they share a point */
      if(hit(segsOf[i][0], segsOf[i][1], segsOf[j][0], segsOf[j][1])) n++;
    }
  return n;
}

/* ---- A SEEDED GENERATOR IS AN AUTHORING TOOL -----------------------------
   Everything built in the last two passes — sector bests, the live delta,
   qualifying, lap records — is about improving on a track you KNOW. A lap
   record on a circuit you will never see again is meaningless, and procedural
   generation was quietly undermining the features built on top of it.

   The fix is not to abandon the generator. It is to stop running it at
   RUNTIME. Seeded, the same number always yields the same track, so the
   generator can be run thousands of times offline, the good ones kept, and
   the arcade ships a fixed list of seeds. Zero authoring burden, and every
   track is fixed, nameable and learnable.
   ------------------------------------------------------------------------- */
var _rngState = 0;
function seedRng(n){ _rngState = (n >>> 0) || 1; }
function srnd(a, b){
  /* xorshift32 — deterministic, and good enough for track shapes */
  _rngState ^= _rngState << 13; _rngState >>>= 0;
  _rngState ^= _rngState >> 17;
  _rngState ^= _rngState << 5;  _rngState >>>= 0;
  const u = _rngState / 4294967296;
  return a === undefined ? u : a + u * (b - a);
}
function srint(a, b){ return Math.floor(srnd(a, b + 1)); }

function buildCircuit(league, seed){
  /* a track IS its seed. Given one, this function is a pure map from a number
     to a circuit — which is what makes curation possible. */
  seedRng(seed || ((srnd()*4294967290)|0) + 1);
  const theSeed = _rngState;
  /* ---- CLOSED FIRST, CURVATURE SECOND -----------------------------------
     Every previous version built a sequence of (curvature, length) segments
     and hoped it came back. It never did: guaranteeing the total TURN is 2pi
     is necessary and not sufficient, because a spiral turns 360 degrees too.
     Closing needs the sum of the position VECTORS to be zero, and a sequential
     walk has no way to enforce that.

     So stop walking. Build a CLOSED SHAPE first \u2014 points around a circle,
     jittered for character, smoothed into a loop \u2014 and then READ the curvature
     off that path. Closure is a property of the source shape and cannot be
     violated by anything downstream.

     Crossings are then almost free too: a star-shaped polygon (points sorted
     by angle around a centre, radii kept within a band) cannot cross itself.
     ------------------------------------------------------------------- */
  const spec = league === 'gp'
      /* ---- THE TRACKS WERE A THOUSAND KILOMETRES LONG ------------------
         `size` is the RADIUS, so 105,000 gave a lap of about 660,000 units —
         and a lap that long spreads 2\u03c0 of turning so thinly that every sample
         came out at k = 0.02. Measured: **95% of every lap was straight and
         nothing at all was tight.** They looked like circuits on the map and
         drove like a motorway.

         A corner is only a corner if the curvature is big enough to push you
         wide. Scaled to give laps in the 90k-150k range, which is where the
         same 2\u03c0 produces k values of 1 to 4 — the band the cornering force was
         tuned against in Interstate.
         -------------------------------------------------------------- */
      /* ---- WHAT THE RESEARCH SAYS ---------------------------------------
         I had FORMULA as the smoothest league — fewest tight corners — and that
         is backwards. A grand prix circuit is not gentle; it has the widest
         RANGE. Silverstone's Copse is taken at 180mph and Monaco's Fairmont
         hairpin at 30, and both are formula corners. What separates the league
         is not an absence of hairpins but the presence of BOTH extremes.

         So formula gets the most control points AND the biggest jitter: long
         fast sweepers joined by genuinely tight turns. A sports circuit is
         uniformly medium — fewer, tighter, no great sweeps and no true
         hairpins. GT sits between.

         A hairpin is also where braking decides the lap, which is why it
         belongs with the cars that can brake.
         ---------------------------------------------------------------- */
      /* ---- A LAP HAS TO LAST ------------------------------------------
         Simulated with the real car stats, laps came out at 14-20 SECONDS. A
         real circuit lap is 60 to 120. The tracks were the right shape and a
         quarter of the size they needed to be.

         Simply scaling `size` up makes the curvature gentler and turns every
         corner into a sweep — that was the 95%-straight failure. So the
         control-point COUNT scales with it: more corners over a longer lap
         keeps each corner as sharp as it was while the lap gets longer.
         ---------------------------------------------------------------- */
      ? { pts:[26,34], jitter:0.40, longBias:0.65, size:74000, spike:0.30,
          /* the 90-degree cap shortened GP's hairpins and its slowest corner
             went from 123 to 147mph. A capped corner is still slow if its
             RADIUS is small, so the radius comes down to compensate — sweep
             and radius are independent levers and only one of them is
             constrained by the renderer. */
          hairpins:4, hairpinR:2300 }
    : league === 'gt'
      ? { pts:[23,30], jitter:0.30, longBias:0.50, size:62000, spike:0.20,
          hairpins:2, hairpinR:4600 }
      : { pts:[20,26], jitter:0.24, longBias:0.35, size:50000, spike:0.10,
          hairpins:3, hairpinR:5400 };

  const N = srint(spec.pts[0], spec.pts[1]);

  /* ---- THE LOOP, WITH ROOM FOR HAIRPINS -------------------------------
     Points sorted by angle around a circle: star-shaped, so it cannot cross
     itself. The jitter gives character; the radius band stops it becoming a
     splinter.

     A HAIRPIN is not one point pulled deep — that overshoots and crosses. It
     is THREE points close together in ANGLE at a short radius: the spline has
